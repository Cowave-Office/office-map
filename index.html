        window.tailwind.config = {

    <style>
        :root { 
            --print-scale: 0.6; 
            --seat-font-size: 10px; /* 글자 크기 변수화 */
        }
        
        body { -webkit-font-smoothing: antialiased; touch-action: none; /* 모바일 브라우저 기본 제스처 방지 */ }
        .fa-solid { color: #4F81BD !important; }
        
        .header-icon { color: #4F81BD !important; }
        .text-stone-400 .fa-solid { color: #a8a29e !important; }
        .text-stone-500.fa-solid { color: #78716c !important; }
        .text-white .fa-solid, .fa-print, .fa-key, .fa-file-import, .fa-file-excel { color: inherit !important; }

        .map-canvas-bg {
            background-color: #e5e2d8;
            background-image: radial-gradient(#cbc6b7 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        .grab-mode { cursor: grab; }
        .grabbing-mode { cursor: grabbing !important; }

        .excel-table-layout {
            border-collapse: collapse; 
            table-layout: fixed;
            margin: 0 auto;
        }

        .excel-table-layout td {
            height: 26px; padding: 0; margin: 0; 
            font-size: var(--seat-font-size); 
            font-weight: 700; text-align: center; vertical-align: middle; 
            color: #33302a; white-space: pre-wrap; word-break: keep-all; 
            line-height: 1.15; user-select: none; box-sizing: border-box; position: relative;
        }

        .seat-td { transition: all 0.15s ease-in-out; }
        .seat-td:hover {
            transform: translateY(-2px) scale(1.12);
            box-shadow: 0 8px 18px rgba(0,0,0,0.18);
            z-index: 50; position: relative;
            outline: 2.5px solid #4F81BD !important;
            border-color: transparent !important;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); outline: 0px solid rgba(79, 129, 189, 0.7); }
            50% { transform: scale(1.18); outline: 6px solid rgba(79, 129, 189, 0); }
            100% { transform: scale(1); outline: 0px solid rgba(79, 129, 189, 0); }
        }
        
        /* 일반 검색 결과 하이라이트 */
        .highlight-seat {
            animation: pulse-glow 1.2s infinite; z-index: 40 !important;
            border: 2px solid #4F81BD !important; background-color: #4F81BD !important;
            color: #ffffff !important; font-weight: 900 !important;
        }
        
        /* 엔터키로 포커스된 현재 타겟 좌석 하이라이트 (주황색) */
        .active-match {
            outline: 3px solid #f59e0b !important;
            background-color: #f59e0b !important;
            color: #ffffff !important;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
            z-index: 60 !important;
            transform: translateY(-2px) scale(1.15);
            animation: none !important;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #e5e2d8; }
        ::-webkit-scrollbar-thumb { background: #c5c0b2; }
        ::-webkit-scrollbar-thumb:hover { background: #a39e90; }

        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            header, #secondaryToolbar { display: none !important; }
            body, html, main#viewport { height: auto !important; overflow: visible !important; background: white !important; position: static !important; padding: 0 !important; }
            #floorplanContainer { transform: scale(var(--print-scale)) !important; transform-origin: top left !important; box-shadow: none !important; border: none !important; margin: 0 !important; padding: 0 !important; }
        }
    </style>

    <script>
        (function() {
            document.addEventListener('DOMContentLoaded', () => {
                const dirContent = document.getElementById('dirContent');
                const dirPanel = document.getElementById('dirPanel');
                const toggleDirBtn = document.getElementById('toggleDirBtn');

                /** 
                 * 수정 사항 4: 전체 리스트에서 클릭 시 리스트가 닫히는 현상 방지
                 * 이벤트 캡처링 단계에서 클릭을 가로채고, 즉시 숨김 상태를 해제합니다.
                 */
                if (dirContent) {
                    dirContent.addEventListener('click', (e) => {
                        const isHeader = e.target.tagName && e.target.tagName.match(/^H\d$/);
                        const isContainer = e.target === dirContent || e.target.classList.contains('grid');
                        
                        if (!isHeader && !isContainer) {
                            const forceKeepOpen = () => {
                                if (dirPanel && dirPanel.classList.contains('hidden')) {
                                    dirPanel.classList.remove('hidden');
                                    dirPanel.style.display = ''; 
                                    if (toggleDirBtn) toggleDirBtn.setAttribute('aria-expanded', 'true');
                                }
                            };
                            // app.js의 숨김 로직이 실행된 직후 다시 열리도록 처리
                            setTimeout(forceKeepOpen, 10);
                            setTimeout(forceKeepOpen, 100);
                        }
                    }, true);
                }

                /**
                 * 수정 사항 1, 2, 3, 5: 부서 및 시설 항목 카테고리 이동 및 추가/제거
                 */
                const PATCH_RULES = {
                    'daerung': { 
                        facilities: ['실외기'], 
                        depts: [], 
                        remove: [] 
                    },
                    'woorim': { 
                        facilities: ['401', '402', '601', '602', '603', '604', '실외기'], 
                        depts: [], 
                        remove: [] 
                    },
                    'dk18': { 
                        facilities: [], 
                        depts: ['커넥트파이낸스'], 
                        remove: ['김성실'] 
                    },
                    'dk17': { facilities: [], depts: [], remove: [] },
                    'gplus': { 
                        facilities: ['남자휴게실', '비즈센터 교육장', '샤워실(남)', '샤워실(여)', '세미나실', '여자휴게실', '휴게실', '카페테리아'], 
                        depts: [], 
                        remove: [] 
                    }
                };

                let isPatching = false;
                
                const applyDirectoryPatches = () => {
                    if (isPatching || !dirContent) return;
                    
                    const activeBtn = document.querySelector('.tab-btn.bg-\\[\\#4F81BD\\]') || 
                                      document.querySelector('.tab-btn.text-white');
                    const tab = activeBtn ? activeBtn.dataset.tab : document.body.dataset.office;
                    const rules = PATCH_RULES[tab];
                    
                    if (!rules) return;

                    isPatching = true; // 무한 루프 방지

                    try {
                        let deptTitle = null;
                        let facTitle = null;

                        // 텍스트 기반으로 정확하게 "부서 및 팀", "회의실 및 시설" 컨테이너 식별
                        const walker = document.createTreeWalker(dirContent, NodeFilter.SHOW_TEXT, null, false);
                        let node;
                        while ((node = walker.nextNode())) {
                            const text = node.nodeValue.trim();
                            if (text === '부서 및 팀') {
                                deptTitle = node.parentElement;
                                while(deptTitle.parentElement && deptTitle.parentElement.parentElement !== dirContent && !['H2','H3','H4','DIV'].includes(deptTitle.tagName)) {
                                    deptTitle = deptTitle.parentElement;
                                }
                            }
                            if (text === '회의실 및 시설') {
                                facTitle = node.parentElement;
                                while(facTitle.parentElement && facTitle.parentElement.parentElement !== dirContent && !['H2','H3','H4','DIV'].includes(facTitle.tagName)) {
                                    facTitle = facTitle.parentElement;
                                }
                            }
                        }

                        // 헤더 다음에 오는 리스트 컨테이너(ul, grid 등) 찾기
                        const getListContainer = (titleEl) => {
                            if (!titleEl) return null;
                            let next = titleEl.nextElementSibling;
                            if (next && (next.tagName === 'UL' || next.classList.contains('grid') || next.classList.contains('flex'))) return next;
                            if (titleEl.parentElement && titleEl.parentElement.children.length > 1) {
                                let container = titleEl.parentElement.querySelector('ul, .grid, .flex');
                                if (container && container !== titleEl) return container;
                            }
                            return titleEl.parentElement;
                        };

                        let deptContainer = getListContainer(deptTitle);
                        let facContainer = getListContainer(facTitle);

                        // 아이템 찾기 함수
                        const findItemElements = (text) => {
                            const matches = [];
                            const itemWalker = document.createTreeWalker(dirContent, NodeFilter.SHOW_TEXT, null, false);
                            let itemNode;
                            while ((itemNode = itemWalker.nextNode())) {
                                if (itemNode.nodeValue.trim() === text) {
                                    matches.push(itemNode.parentElement);
                                }
                            }
                            
                            return matches.map(el => {
                                let wrapper = el;
                                while(wrapper.parentElement && wrapper.parentElement !== deptContainer && wrapper.parentElement !== facContainer && wrapper.parentElement !== dirContent) {
                                    if (wrapper.tagName === 'BUTTON' || wrapper.tagName === 'LI' || wrapper.classList.contains('cursor-pointer') || wrapper.tagName === 'A') {
                                        return wrapper;
                                    }
                                    wrapper = wrapper.parentElement;
                                }
                                return wrapper;
                            });
                        };

                        // 1. 항목 제거 (예: 김성실)
                        rules.remove.forEach(name => {
                            findItemElements(name).forEach(item => item.remove());
                        });

                        // 2. 카테고리 할당 (이동 및 생성)
                        const ensureItems = (names, container, otherContainer) => {
                            if (!container || names.length === 0) return;
                            let target = container.querySelector('.grid, ul, .flex') || container;
                            
                            const existingItem = target.querySelector('button, li, div.cursor-pointer') || 
                                                 (otherContainer && otherContainer.querySelector('button, li, div.cursor-pointer'));
                            
                            names.forEach(name => {
                                const items = findItemElements(name);
                                if (items.length > 0) {
                                    // 기존 아이템이 있다면 목표 카테고리로 이동
                                    items.forEach(item => {
                                        if (!target.contains(item)) target.appendChild(item);
                                    });
                                } else if (existingItem) {
                                    // 기존 리스트에 없다면 새 항목 생성 (예: 우림 401호, 커넥트파이낸스)
                                    const clone = existingItem.cloneNode(true);
                                    const textNodes = Array.from(clone.querySelectorAll('*')).filter(el => 
                                        el.childNodes.length === 1 && el.childNodes[0].nodeType === 3 && el.textContent.trim().length > 0
                                    );
                                    if (textNodes.length > 0) {
                                        textNodes[textNodes.length - 1].textContent = name;
                                    } else {
                                        clone.textContent = name;
                                    }
                                    
                                    // 검색바와 연동하여 커스텀 클릭 이벤트 지정
                                    clone.addEventListener('click', (e) => {
                                        e.stopPropagation();
                                        const searchInput = document.getElementById('searchInput');
                                        if(searchInput) {
                                            searchInput.value = name;
                                            searchInput.dispatchEvent(new Event('input', { bubbles: true }));
                                            searchInput.dispatchEvent(new KeyboardEvent('keydown', { bubbles: true, cancelable: true, keyCode: 13, key: 'Enter' }));
                                            searchInput.dispatchEvent(new KeyboardEvent('keyup', { bubbles: true, cancelable: true, keyCode: 13, key: 'Enter' }));
                                        }
                                    });
                                    target.appendChild(clone);
                                }
                            });
                        };

                        ensureItems(rules.facilities, facContainer, deptContainer);
                        ensureItems(rules.depts, deptContainer, facContainer);

                    } catch(e) {
                        console.error("Directory Patching Error:", e);
                    } finally {
                        isPatching = false;
                    }
                };

                // app.js가 dirContent를 렌더링(업데이트)할 때마다 변경 사항 적용 감지
                const observer = new MutationObserver((mutations) => {
                    let shouldPatch = false;
                    for (let m of mutations) {
                        if (m.addedNodes.length > 0) {
                            shouldPatch = true;
                            break;
                        }
                    }
                    if (shouldPatch) {
                        setTimeout(applyDirectoryPatches, 100);
                    }
                });

                if (dirContent) {
                    observer.observe(dirContent, { childList: true, subtree: true });
                    // 초기 로드 대비 수동 1회 실행
                    setTimeout(applyDirectoryPatches, 300);
                }

                // 1, 2번 수정 사항: 특정 텍스트 세로 표기 처리
                const floorplanContainer = document.getElementById('dynamicFloorplan');
                const verticalTargets = ["사업관리팀", "제휴비즈니스팀", "셀피아팀", "품질관리팀", "마케팅팀", "김성실"];
                
                const applyVerticalText = () => {
                    if (!floorplanContainer) return;
                    const tds = floorplanContainer.querySelectorAll('td');
                    tds.forEach(td => {
                        if (!td.dataset.verticalApplied) {
                            const text = td.textContent.trim(); 
                            // 대상 목록에 포함된 텍스트일 경우 세로 표기로 변환
                            if (verticalTargets.includes(text)) {
                                td.innerHTML = text.split('').join('<br>');
                                td.dataset.verticalApplied = "true"; // 중복 적용 방지
                                td.style.lineHeight = "1.15";
                                td.style.padding = "2px 0";
                            }
                        }
                    });
                };

                // 배치도가 업데이트 될 때마다 세로 표기 함수 실행
                if (floorplanContainer) {
                    const floorplanObserver = new MutationObserver(() => {
                        applyVerticalText();
                    });
                    floorplanObserver.observe(floorplanContainer, { childList: true, subtree: true });
                    // 초기 로드 대비 수동 1회 실행
                    setTimeout(applyVerticalText, 500);
                }
            });
        })();
    </script>
</body>
</html>
