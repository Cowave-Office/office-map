<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사내 사무실 자리배치도 통합 뷰어</title>
    <meta name="robots" content="noindex, nofollow"> <!-- 외부 검색엔진 노출 방지 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .nav-btn.active {
            background-color: #4F81BD;
            color: #ffffff;
            font-weight: 700;
        }
    </style>
</head>
<body class="bg-stone-900 text-stone-100 h-screen flex flex-col overflow-hidden font-sans">

    <!-- 상단 통합 네비게이션 헤더 -->
    <header class="bg-stone-900 border-b border-stone-800 px-6 py-2.5 flex flex-wrap items-center justify-between shadow-lg z-50 shrink-0">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-map-location-dot text-[#4F81BD] text-xl"></i>
            <span class="text-base font-extrabold tracking-tight text-white">사무실 자리배치도</span>
        </div>

        <!-- 5개 도면 전환 버튼 목록 -->
        <nav class="flex items-center gap-1.5 bg-stone-800 p-1 rounded-xl border border-stone-700">
            <button onclick="switchMap('dk17.html', this)" class="nav-btn active px-3.5 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1.5 hover:bg-stone-700">
                <i class="fa-solid fa-building"></i> 가산DK 17F
            </button>
            <button onclick="switchMap('dk18.html', this)" class="nav-btn px-3.5 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1.5 hover:bg-stone-700 text-stone-300">
                <i class="fa-solid fa-building"></i> 가산DK 18F
            </button>
            <button onclick="switchMap('daerung.html', this)" class="nav-btn px-3.5 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1.5 hover:bg-stone-700 text-stone-300">
                <i class="fa-solid fa-building"></i> 대륭
            </button>
            <button onclick="switchMap('glpus.html', this)" class="nav-btn px-3.5 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1.5 hover:bg-stone-700 text-stone-300">
                <i class="fa-solid fa-building"></i> G플러스
            </button>
            <button onclick="switchMap('woorim.html', this)" class="nav-btn px-3.5 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1.5 hover:bg-stone-700 text-stone-300">
                <i class="fa-solid fa-building"></i> 우림
            </button>
        </nav>

        <div class="text-xs text-stone-400">
            <i class="fa-solid fa-lock text-stone-500 mr-1"></i> 사내 전용
        </div>
    </header>

    <!-- 도면 출력 iframe 영역 -->
    <main class="flex-1 w-full h-full relative bg-stone-100">
        <iframe id="mapFrame" src="dk17.html" class="w-full h-full border-none"></iframe>
    </main>

    <script>
        function switchMap(fileUrl, btnElement) {
            document.getElementById('mapFrame').src = fileUrl;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active', 'text-white');
                btn.classList.add('text-stone-300');
            });
            btnElement.classList.add('active', 'text-white');
            btnElement.classList.remove('text-stone-300');
        }
    </script>
</body>
</html>
