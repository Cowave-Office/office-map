<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커넥트웨이브통합 공간배치도 (좌석 및 시설 안내)</title>
    <meta name="robots" content="noindex, nofollow">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

    <script>
        // ReferenceError 방지를 위한 안전한 초기화 (CDN 로드 지연 시 대비)
        window.tailwind = window.tailwind || {};
        window.tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Noto Sans KR', 'sans-serif'] },
                    colors: { themeBlue: '#4F81BD' }
                }
            }
        };
    </script>

    <style>
        :root { 
            --print-scale: 0.6; 
            --seat-font-size: 10px; /* 글자 크기 변수화 */
        }
        
        body { -webkit-font-smoothing: antialiased; touch-action: manipulation; }
        .fa-solid { color: #4F81BD !important; }
        
        .header-icon { color: #4F81BD !important; }
        .text-stone-400 .fa-solid { color: #a8a29e !important; }
        .text-stone-500.fa-solid { color: #78716c !important; }
        .text-white .fa-solid, .fa-print, .fa-key, .fa-file-import, .fa-file-excel { color: inherit !important; }

        .map-canvas-bg {
            background-color: #e5e2d8;
            background-image: radial-gradient(#cbc6b7 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        .grab-mode { cursor: grab; }
        .grabbing-mode { cursor: grabbing !important; }

        .excel-table-layout {
            border-collapse: collapse; 
            table-layout: fixed;
            margin: 0 auto;
        }

        .excel-table-layout td {
            height: 26px; padding: 0; margin: 0; 
            font-size: var(--seat-font-size); 
            font-weight: 700; text-align: center; vertical-align: middle; 
            color: #33302a; white-space: pre-wrap; word-break: keep-all; 
            line-height: 1.15; user-select: none; box-sizing: border-box; position: relative;
        }

        .seat-td { transition: transform 0.15s ease-in-out, box-shadow 0.15s ease-in-out, outline-color 0.15s ease-in-out; }
        .seat-td:hover {
            transform: translateY(-2px) scale(1.12);
            box-shadow: 0 8px 18px rgba(0,0,0,0.18);
            z-index: 50; position: relative;
            outline: 2.5px solid #4F81BD !important;
            border-color: transparent !important;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); outline: 0px solid rgba(79, 129, 189, 0.7); }
            50% { transform: scale(1.18); outline: 6px solid rgba(79, 129, 189, 0); }
            100% { transform: scale(1); outline: 0px solid rgba(79, 129, 189, 0); }
        }
        
        /* 일반 검색 결과 하이라이트 */
        .highlight-seat {
            animation: pulse-glow 1.2s infinite; z-index: 40 !important;
            border: 2px solid #4F81BD !important; background-color: #4F81BD !important;
            color: #ffffff !important; font-weight: 900 !important;
        }
        
        /* 엔터키로 포커스된 현재 타겟 좌석 하이라이트 (주황색) */
        .active-match {
            outline: 3px solid #f59e0b !important;
            background-color: #f59e0b !important;
            color: #ffffff !important;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
            z-index: 60 !important;
            transform: translateY(-2px) scale(1.15);
            animation: none !important;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #e5e2d8; }
        ::-webkit-scrollbar-thumb { background: #c5c0b2; }
        ::-webkit-scrollbar-thumb:hover { background: #a39e90; }

        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            header, #secondaryToolbar { display: none !important; }
            body, html, main#viewport { height: auto !important; overflow: visible !important; background: white !important; position: static !important; padding: 0 !important; }
            #floorplanContainer { transform: scale(var(--print-scale)) !important; transform-origin: top left !important; box-shadow: none !important; border: none !important; margin: 0 !important; padding: 0 !important; }
        }
    </style>
<link rel="stylesheet" href="map.css">

    <style id="cw-index-ux-patch">
        /* 지도 영역만 터치 제스처를 제어하고 검색 입력창은 OS 기본 편집 동작을 유지 */
        #viewport { touch-action: none; }
        #searchInput {
            touch-action: auto !important;
            -webkit-user-select: text !important;
            user-select: text !important;
            caret-color: auto;
        }

        /* 독립 검색 결과 패널 */
        #searchBox { z-index: 90; }
        #searchBox #searchPopup {
            position: absolute;
            top: calc(100% + 7px);
            left: 0;
            right: 0;
            z-index: 200;
            max-height: 340px;
            overflow-y: auto;
            background: rgba(255,255,255,.98);
            border: 1px solid #d6d3d1;
            border-radius: 12px;
            box-shadow: 0 14px 30px rgba(0,0,0,.16);
            padding: 6px;
        }
        #searchBox #searchPopup[hidden] { display: none !important; }
        #searchSummary {
            padding: 7px 10px 6px;
            color: #78716c;
            font-size: 11px;
            font-weight: 700;
        }
        .cw-search-result {
            width: 100%;
            border: 0;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 10px;
            border-radius: 9px;
            text-align: left;
            cursor: pointer;
            color: #292524;
        }
        .cw-search-result:hover,
        .cw-search-result[aria-selected="true"] { background: #eff6ff; }
        .cw-search-result .cw-result-main {
            min-width: 0;
            font-size: 13px;
            font-weight: 800;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .cw-search-result .cw-result-meta {
            flex: none;
            font-size: 10px;
            font-weight: 800;
            color: #4F81BD;
            background: #eff6ff;
            border: 1px solid #dbeafe;
            border-radius: 999px;
            padding: 3px 7px;
        }

        /* 회의실/시설: 각 셀의 실제 크기에 맞춰 JS가 가능한 최대 글자 크기를 계산 */
        .excel-table-layout td.cw-facility-cell {
            font-weight: 800 !important;
            line-height: 1.08 !important;
            writing-mode: horizontal-tb !important;
            text-orientation: mixed !important;
            overflow: hidden !important;
        }

        /* 셀 안 텍스트를 독립 레이어로 표시해 기존 세로쓰기/<br> 영향을 완전히 차단 */
        .excel-table-layout td .cw-cell-label {
            position: absolute !important;
            inset: 1px 2px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            text-align: center !important;
            writing-mode: horizontal-tb !important;
            text-orientation: mixed !important;
            overflow: hidden !important;
            box-sizing: border-box !important;
            line-height: 1.08 !important;
            font-weight: inherit !important;
            pointer-events: none !important;
        }

        /* 세로로 깨지던 특정 공간/팀명은 한 줄 가로표기를 최우선으로 유지 */
        .excel-table-layout td.cw-force-horizontal,
        .excel-table-layout td.cw-force-horizontal .cw-cell-label {
            writing-mode: horizontal-tb !important;
            text-orientation: mixed !important;
            white-space: nowrap !important;
            word-break: normal !important;
            overflow-wrap: normal !important;
            overflow: hidden !important;
        }

        /* 라운지: 출입문의 연녹색과 혼동되지 않도록 따뜻한 살구/앰버 계열로 구분 */
        .excel-table-layout td.cw-lounge-cell {
            background-color: #FCE8D5 !important;
            color: #7A472A !important;
            border-color: #D9A277 !important;
        }

        /* 향후 엑셀 셀에 '비상계단'을 입력하면 자동 적용되는 안전 표기 */
        .excel-table-layout td.cw-emergency-stair-cell {
            background-color: #DCFCE7 !important;
            color: #166534 !important;
            border: 2px solid #22C55E !important;
            font-weight: 900 !important;
            writing-mode: horizontal-tb !important;
            overflow: hidden !important;
        }
        .excel-table-layout td.cw-emergency-stair-cell::before {
            content: "↗";
            display: inline-block;
            margin-right: 3px;
            font-weight: 900;
        }


        /* 전체 리스트: 상단 확장 대신 지도 왼쪽의 독립 사이드바로 표시 */
        #workspaceShell { min-width: 0; min-height: 0; }
        #dirPanel {
            width: clamp(280px, 24vw, 360px);
            flex: 0 0 clamp(280px, 24vw, 360px);
            max-height: none !important;
            border-top: 0 !important;
            background: rgba(255,255,255,.98);
            position: relative;
            z-index: 25;
        }
        #dirPanel:not(.hidden) { display: block !important; height: 100%; min-height: 0; visibility: visible !important; }
        #dirContent {
            display: block !important;
            max-width: none !important;
            margin: 0 !important;
            padding: 16px !important;
        }
        #dirContent > * + * { margin-top: 22px; }
        #dirContent .grid { grid-template-columns: 1fr !important; }

        /* 좌측 전체리스트 - 기존 '부서 및 팀 / 회의실 및 시설' 구성을 사이드바에 맞게 복원 */
        .cw-dir-section {
            border: 1px solid #e7e5e4; border-radius: 12px; background: #ffffff;
            overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.04);
        }
        .cw-dir-section + .cw-dir-section { margin-top: 14px !important; }
        .cw-dir-title {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            padding: 11px 12px; background: #f8fafc; border-bottom: 1px solid #e7e5e4;
            color: #334155; font-size: 13px; font-weight: 900; position: sticky; top: 0; z-index: 2;
        }
        .cw-dir-title .cw-dir-count {
            flex: none; min-width: 24px; padding: 2px 7px; border-radius: 999px;
            background: #eaf2fb; color: #4F81BD; font-size: 10px; font-weight: 900; text-align: center;
        }
        .cw-dir-list { display: grid !important; grid-template-columns: 1fr !important; gap: 5px !important; padding: 8px !important; }
        .cw-dir-item {
            width: 100%; min-height: 32px; display: flex; align-items: center; gap: 8px; padding: 7px 9px;
            border: 1px solid transparent; border-radius: 8px; background: #fff; color: #44403c;
            font-size: 12px; font-weight: 700; text-align: left; cursor: pointer; transition: .12s ease;
        }
        .cw-dir-item::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 999px; background: #94a3b8; }
        .cw-dir-section[data-kind="facility"] .cw-dir-item::before { background: #4F81BD; }
        .cw-dir-item:hover, .cw-dir-item:focus-visible {
            background: #eff6ff; border-color: #bfdbfe; color: #1e3a5f; outline: none;
        }
        .cw-dir-empty { padding: 14px 10px; color: #a8a29e; font-size: 11px; text-align: center; }

        #viewport { min-width: 0; }
        @media (max-width: 720px) {
            #dirPanel { width: 260px; flex-basis: 260px; }
            #dirContent { padding: 12px !important; }
        }
    </style>


<style id="cw-sidebar-final-fix">
  /* FINAL: 전체리스트는 지도와 같은 행의 왼쪽 열에 고정 */

<style id="cw-search-layer-and-directory-highlight-fix">
  #secondaryToolbar{position:relative!important;z-index:120!important;overflow:visible!important;}
  #secondaryToolbar>div{overflow:visible!important;}
  #searchBox{position:relative!important;z-index:140!important;overflow:visible!important;}
  #searchBox #searchPopup,#searchPopup{z-index:9999!important;}
  #workspaceShell>#dirPanel{z-index:20!important;}
  @keyframes cw-directory-pulse{0%{box-shadow:0 0 0 0 rgba(245,158,11,.75)}55%{box-shadow:0 0 0 8px rgba(245,158,11,0)}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
  .cw-directory-highlight{outline:3px solid #f59e0b!important;outline-offset:1px!important;background-color:#f59e0b!important;color:#fff!important;font-weight:900!important;z-index:70!important;position:relative!important;animation:cw-directory-pulse 1.05s ease-out infinite!important;}
  .cw-directory-highlight .cw-cell-label{color:#fff!important;font-weight:900!important;}
</style>


<style id="cw-gplus-door-opening-fix-v2">
  /*
   * GPlus entrance rendering fix.
   * Horizontal entrance cells break the horizontal wall only.
   * Vertical entrance cells break the vertical wall only.
   * "hidden" is intentionally used because it wins in collapsed-border conflict resolution.
   */
  #dynamicFloorplan td.cw-gplus-door-horizontal {
      border-top-style: hidden !important;
      border-bottom-style: hidden !important;
  }

  #dynamicFloorplan td.cw-gplus-door-vertical {
      border-left-style: hidden !important;
      border-right-style: hidden !important;
  }

  #dynamicFloorplan td.cw-gplus-door-horizontal .cw-cell-label,
  #dynamicFloorplan td.cw-gplus-door-vertical .cw-cell-label {
      outline: none !important;
      box-shadow: none !important;
  }
</style>


<style id="cw-security-notice-style">
  #securityNotice .fa-lock{color:#b45309!important;}
  #securityNotice .cw-security-critical{
    color:#dc2626!important;
    font-weight:900!important;
    letter-spacing:-0.01em;
  }
  @media(max-width:640px){
    #securityNotice{align-items:flex-start;line-height:1.45;}
    #securityNotice .cw-security-critical{
      color:#b91c1c!important;
      font-weight:900!important;
    }
  }
</style>


<style id="cw-cross-browser-performance-20261027">
  /*
   * Cross-browser/mobile performance pass.
   * - Avoid expensive hover/transition effects on touch devices.
   * - Keep iOS Safari's dynamic viewport from repeatedly relaying out the page.
   * - Keep scrolling containers on the native accelerated path when possible.
   */
  html, body {
    overscroll-behavior: none;
  }
  #viewport,
  #dirPanel,
  #searchPopup {
    -webkit-overflow-scrolling: touch;
  }
  #viewport {
    overscroll-behavior: contain;
  }

  @supports (height: 100dvh) {
    html, body {
      height: 100dvh !important;
      min-height: 100dvh !important;
    }
  }

  /* Do not animate a huge floorplan while a pointer/wheel interaction is in progress. */
  body.cw-map-interacting #floorplanContainer {
    transition: none !important;
  }

  @media (hover: none), (pointer: coarse), (max-width: 820px) {
    .seat-td {
      transition: none !important;
    }
    .seat-td:hover {
      transform: none !important;
      box-shadow: none !important;
      outline-width: 0 !important;
    }
    #floorplanContainer {
      transition: none !important;
      /* shadow-2xl over a very large transformed layer is costly on iOS/WebKit */
      box-shadow: 0 4px 14px rgba(0,0,0,.12) !important;
      border-radius: 16px !important;
    }
    .highlight-seat,
    .cw-directory-highlight {
      animation: none !important;
    }
    .active-match {
      transform: none !important;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>

<body data-office="daerung" data-design="original" class="bg-stone-100 text-stone-800 h-screen flex flex-col overflow-hidden font-sans antialiased">

    <header class="bg-white border-b border-stone-200 px-6 py-3 flex flex-wrap items-center justify-between shadow-sm z-30 shrink-0">
        
        <div class="flex items-center gap-3.5 mb-2 md:mb-0">
            <div id="adminLoginBtn" class="p-1.5 bg-white rounded-xl shadow-sm border border-stone-200 cursor-pointer hover:bg-stone-50 transition flex items-center justify-center" title="관리자 모드">

                            el.childNodes.length === 1 &&
                            el.childNodes[0].nodeType === Node.TEXT_NODE &&
                            normalizeText(el.textContent)
                        );
                        if (textCandidates.length) textCandidates[textCandidates.length - 1].textContent = name;
                        else clone.textContent = name;

                        clone.addEventListener('click', e => {
                            e.stopPropagation();
                            const input = document.getElementById('searchInput');
                            if (input) {
                                input.value = name;
                                input.dispatchEvent(new Event('input', { bubbles: true }));
                                input.focus();
                            }
                        });
                        target.appendChild(clone);
                    });
                };

                const patchDirectory = () => {
                    if (!dirContent || directoryPatching) return;
                    const tab = getActiveTab();
                    const rules = PATCH_RULES[tab];
                    if (!rules) return;

                    directoryPatching = true;
                    try {
                        const { deptContainer, facContainer } = getDirectorySections();
                        if (!deptContainer && !facContainer) return;

                        rules.removeAll.forEach(name => {
                            findItemWrappers(dirContent, name).forEach(item => item.remove());
                        });
                        rules.removeFacilities.forEach(name => {
                            findItemWrappers(facContainer, name).forEach(item => item.remove());
                        });

                        ensureDirectoryItems(rules.facilities, facContainer, deptContainer);
                        ensureDirectoryItems(rules.depts, deptContainer, facContainer);

                        const names = collectDirectoryNames(facContainer);
                        rules.removeFacilities.forEach(name => names.delete(name));
                        facilityNamesByTab.set(tab, names);
                    } finally {
                        directoryPatching = false;
                    }
                    scheduleFloorplanPatch();
                };

                const scheduleDirectoryPatch = () => {
                    clearTimeout(directoryPatchTimer);
                    directoryPatchTimer = setTimeout(patchDirectory, 80);
                };

                const isFacilityHeuristic = (text) => {
                    return /(회의실|라운지|엘리베이터|화장실|휴게실|샤워실|세미나실|교육장|카페테리아|창고|출입문|OA|TEST ROOM|Test room|복합기|정수기|원두머신|비상계단|분리수거)/i.test(text);
                };

                /* 전체 리스트를 index 자체에서 구성: app.js가 비우거나 렌더하지 못해도 항상 표시 */
                let embeddedDirectoryIndex = null;
                const getEmbeddedDirectoryIndex = () => {
                    if (embeddedDirectoryIndex) return embeddedDirectoryIndex;
                    try {
                        const el = document.getElementById('cw-embedded-search-index');
                        const parsed = JSON.parse(el?.textContent || '[]');
                        embeddedDirectoryIndex = Array.isArray(parsed) ? parsed : [];
                    } catch (_) { embeddedDirectoryIndex = []; }
                    return embeddedDirectoryIndex;
                };
                const DIRECTORY_EXCLUDES = new Set(['0','1','A','B','C','D','E','F','G','회의실 및 시설','부서 및 팀']);
                const DIRECTORY_EXCLUDES_BY_TAB = {
                    daerung:new Set(['실외기','실외기실']), woorim:new Set(['실외기','실외기실']),
                    dk18:new Set(['김성실']), dk17:new Set([]), gplus:new Set([])
                };
                const isRoomCode = (tab, text) => {
                    const compact = normalizeText(text).replace(/\s+/g,'').toUpperCase();
                    if (!compact) return false;
                    if (tab==='daerung') return /^[A-C]\d{3}[A-Z]?$/.test(compact);
                    if (tab==='woorim') return /^(?:401|402|601|602|603|604|605|801)$/.test(compact);
                    if (tab==='dk18') return /^[AB]\d{3,4}$/.test(compact) || compact==='A1201';
                    if (tab==='dk17') return /^[AB]\d{3,4}$/.test(compact);
                    return false;
                };
                const isDepartmentName = (text) => {
                    const value=normalizeText(text);
                    if (!value || value.length>35 || isFacilityHeuristic(value)) return false;
                    if (/(대표실|임원실|시스템실|메일룸|탕비실|치카룸|수면실|응접실)$/i.test(value)) return false;
                    return /(팀|본부|센터|파트|그룹|사업부|사업본부|TF|실)$/i.test(value);
                };
                const buildDirectoryData = (tab) => {
                    const source=new Set();
                    const indexedItems = getEmbeddedDirectoryIndex().filter(item=>item?.tab===tab);
                    indexedItems.forEach(item=>{
                        const text=normalizeText(item?.text); if(text) source.add(text);
                    });
                    /*
                     * Normal viewing uses the embedded index instead of reading 5,000~8,000 TD nodes.
                     * In admin mode (or if the embedded index is unavailable), read the live DOM so
                     * freshly uploaded workbook data can still be reflected.
                     */
                    const adminControlsEl = document.getElementById('adminControls');
                    const shouldReadLiveDom = !indexedItems.length || (adminControlsEl && !adminControlsEl.classList.contains('hidden'));
                    if (shouldReadLiveDom) {
                        floorplan?.querySelectorAll('td').forEach(td=>{
                            const label=td.querySelector(':scope > .cw-cell-label');
                            const text=normalizeText(label?.textContent || td.dataset.cwLoungeLabel || td.textContent);
                            if(text) source.add(text);
                        });
                    }
                    const excluded=DIRECTORY_EXCLUDES_BY_TAB[tab]||new Set();
                    const facilities=new Set(), departments=new Set();
                    source.forEach(raw=>{
                        const text=normalizeText(raw);
                        if(!text || DIRECTORY_EXCLUDES.has(text) || excluded.has(text)) return;
                        if(/^[-+]?\d+(?:\.\d+)?$/.test(text) && !isRoomCode(tab,text)) return;
                        const facility=isFacilityHeuristic(text)||isRoomCode(tab,text)||/^(?:메일룸|탕비실|프로젝트룸|임원실|부문대표실|총괄대표실|사업대표실|대표실|시스템실|GA창고|공용창고|오픈형 창고)$/i.test(text);
                        if(facility) facilities.add(text); else if(isDepartmentName(text)) departments.add(text);
                    });
                    const rules=PATCH_RULES[tab];
                    rules?.facilities?.forEach(n=>{if(!excluded.has(n)) facilities.add(n)});
                    rules?.depts?.forEach(n=>departments.add(n));
                    rules?.removeFacilities?.forEach(n=>facilities.delete(n));
                    rules?.removeAll?.forEach(n=>{facilities.delete(n);departments.delete(n)});
                    const sorter=(a,b)=>a.localeCompare(b,'ko',{numeric:true,sensitivity:'base'});
                    return {departments:[...departments].sort(sorter),facilities:[...facilities].sort(sorter)};
                };
                const activateDirectoryItem=(name)=>{
                    const input=document.getElementById('searchInput'); if(!input) return;
                    input.value=name; input.dispatchEvent(new Event('input',{bubbles:true})); input.focus();
                };
                const createDirectorySection=(title,names,kind)=>{
                    const section=document.createElement('section'); section.className='cw-dir-section'; section.dataset.kind=kind;
                    const heading=document.createElement('div'); heading.className='cw-dir-title';
                    const label=document.createElement('span'); label.textContent=title;
                    const count=document.createElement('span'); count.className='cw-dir-count'; count.textContent=String(names.length);
                    heading.append(label,count);
                    const list=document.createElement('div'); list.className='cw-dir-list';
                    if(!names.length){const empty=document.createElement('div');empty.className='cw-dir-empty';empty.textContent='표시할 항목이 없습니다.';list.appendChild(empty);}
                    else names.forEach(name=>{const btn=document.createElement('button');btn.type='button';btn.className='cw-dir-item';btn.textContent=name;btn.dataset.directoryName=name;btn.addEventListener('click',()=>activateDirectoryItem(name));list.appendChild(btn);});
                    section.append(heading,list); return section;
                };
                const renderDirectoryContent=()=>{
                    if(!dirContent) return; const tab=getActiveTab(); const {departments,facilities}=buildDirectoryData(tab);
                    dirContent.replaceChildren(createDirectorySection('부서 및 팀',departments,'department'),createDirectorySection('회의실 및 시설',facilities,'facility'));
                    facilityNamesByTab.set(tab,new Set(facilities));
                };
                const directoryHasSections=()=>!!findSectionTitle('부서 및 팀') && !!findSectionTitle('회의실 및 시설');
                const ensureDirectoryRendered=()=>{if(dirContent && !directoryHasSections()) renderDirectoryContent();};

                const shouldForceHorizontal = (tab, text) => {
                    const exact = HORIZONTAL_EXACT[tab];
                    if (exact?.has(text)) return true;
                    const compact = text.replace(/\s+/g, '');
                    /* 대륭의 회의실 코드(A401/B802/A801 등)는 모두 가로표기 */
                    if (tab === 'daerung' && /^[A-C]\d{3}[A-Z]?$/.test(compact)) return true;
                    if (tab === 'woorim' && /^(?:사업관리팀|제휴비즈니스팀|셀피아팀|마케팅팀)$/.test(compact)) return true;
                    if (tab === 'dk18' && (/^(?:A1201|Testroom|TESTROOM)$/.test(compact) || /^OA(?:존.*)?$/i.test(compact) || /^비상용엘리베이터[AB]$/i.test(compact))) return true;
                    if (tab === 'gplus' && /^(?:화물엘리베이터|분리수거공간|엘리베이터A|엘리베이터B)$/.test(compact)) return true;
                    return false;
                };

                /* 우림의 아래 4개 항목은 '시설'이 아니라 팀명이다.
                   가로 표기는 유지하되 일반 부서/팀과 동일한 글씨 크기를 사용한다. */
                const isWoorimNormalTeamLabel = (tab, text) => {
                    if (tab !== 'woorim') return false;
                    const compact = normalizeText(text).replace(/\s+/g, '');
                    return /^(?:사업관리팀|제휴비즈니스팀|셀피아팀|마케팅팀)$/.test(compact);
                };

                const ensureCellLabel = (td, text, forceHorizontal = false) => {
                    if (!td || !text) return null;
                    let label = td.querySelector(':scope > .cw-cell-label');
                    if (!label) {
                        td.replaceChildren();
                        label = document.createElement('span');
                        label.className = 'cw-cell-label';
                        td.appendChild(label);
                    }
                    if (label.textContent !== text) label.textContent = text;
                    label.classList.toggle('cw-nowrap-label', !!forceHorizontal);
                    label.style.whiteSpace = forceHorizontal ? 'nowrap' : 'normal';
                    label.style.wordBreak = forceHorizontal ? 'normal' : 'keep-all';
                    label.style.overflowWrap = forceHorizontal ? 'normal' : 'break-word';
                    return label;
                };

                /*
                 * 시설/회의실 글씨는 가능한 크게 시작한 뒤 실제 셀 영역을 넘는 순간까지 0.5px씩 줄인다.
                 * 강제 가로표기 항목은 절대 줄바꿈하지 않고 한 줄 안에서 맞춘다.
                 */
                const fitCellText = (td, text, forceHorizontal, preferredMaxPx) => {
                    if (!td || !td.isConnected || !text) return;
                    const label = ensureCellLabel(td, text, forceHorizontal);
                    if (!label) return;

                    const availableWidth = Math.max(4, td.clientWidth - 6);
                    const availableHeight = Math.max(4, td.clientHeight - 4);
                    const maxSize = Math.max(8, Math.min(20, preferredMaxPx || 16));
                    const minSize = 6.5;
                    const fitKey = `${text}|${forceHorizontal ? 1 : 0}|${availableWidth}|${availableHeight}|${maxSize}`;
                    if (label.dataset.cwFitKey === fitKey) return;

                    label.style.maxWidth = `${availableWidth}px`;
                    label.style.maxHeight = `${availableHeight}px`;

                    /*
                     * Binary search caps forced layout checks at 6 instead of shrinking by
                     * 0.5px up to ~30 times. This is a major win on iOS/WebKit tables.
                     */
                    let low = minSize;
                    let high = maxSize;
                    let best = minSize;
                    for (let i = 0; i < 6; i++) {
                        const size = Math.round(((low + high) / 2) * 2) / 2;
                        label.style.fontSize = `${size}px`;
                        const fits = label.scrollWidth <= availableWidth + 1 && label.scrollHeight <= availableHeight + 1;
                        if (fits) {
                            best = size;
                            low = size + 0.5;
                        } else {
                            high = size - 0.5;
                        }
                        if (low > high) break;
                    }

                    label.style.fontSize = `${best}px`;
                    td.style.fontSize = `${best}px`;
                    label.dataset.cwFitKey = fitKey;
                };

                /*
                 * 하나의 라운지 공간이 여러 병합 셀로 나뉘어 같은 명칭이 반복되는 경우,
                 * 서로 맞닿은 동일 라운지 셀을 한 영역으로 보고 가장 큰 셀에만 명칭을 남긴다.
                 * 라운지가 서로 떨어져 있으면 각각 한 번씩 표시된다.
                 */
                const dedupeLoungeLabels = () => {
                    if (!floorplan) return;

                    const loungeCells = [...floorplan.querySelectorAll('td.cw-lounge-cell')]
                        .map(td => {
                            const label = normalizeText(td.dataset.cwLoungeLabel || td.textContent);
                            if (!label || !label.includes('라운지')) return null;
                            if (!td.dataset.cwLoungeLabel) td.dataset.cwLoungeLabel = label;
                            const rect = td.getBoundingClientRect();
                            return {
                                td,
                                label,
                                rect,
                                area: Math.max(1, rect.width * rect.height)
                            };
                        })
                        .filter(Boolean);

                    if (loungeCells.length < 2) return;

                    const byLabel = new Map();
                    loungeCells.forEach(item => {
                        if (!byLabel.has(item.label)) byLabel.set(item.label, []);
                        byLabel.get(item.label).push(item);
                    });

                    const overlapLength = (a1, a2, b1, b2) => Math.min(a2, b2) - Math.max(a1, b1);
                    const cellsTouch = (a, b) => {
                        const tolerance = 3;
                        const verticalOverlap = overlapLength(a.rect.top, a.rect.bottom, b.rect.top, b.rect.bottom);
                        const horizontalOverlap = overlapLength(a.rect.left, a.rect.right, b.rect.left, b.rect.right);
                        const horizontalTouch = verticalOverlap > 1 && (
                            Math.abs(a.rect.right - b.rect.left) <= tolerance ||
                            Math.abs(b.rect.right - a.rect.left) <= tolerance
                        );
                        const verticalTouch = horizontalOverlap > 1 && (
                            Math.abs(a.rect.bottom - b.rect.top) <= tolerance ||
                            Math.abs(b.rect.bottom - a.rect.top) <= tolerance
                        );
                        const overlaps = verticalOverlap > 1 && horizontalOverlap > 1;
                        return overlaps || horizontalTouch || verticalTouch;
                    };

                    byLabel.forEach(items => {
                        const visited = new Set();

                        items.forEach((item, startIndex) => {
                            if (visited.has(startIndex)) return;

                            const stack = [startIndex];
                            const component = [];
                            visited.add(startIndex);

                            while (stack.length) {
                                const currentIndex = stack.pop();
                                const current = items[currentIndex];
                                component.push(current);

                                items.forEach((candidate, candidateIndex) => {
                                    if (visited.has(candidateIndex)) return;
                                    if (cellsTouch(current, candidate)) {
                                        visited.add(candidateIndex);
                                        stack.push(candidateIndex);
                                    }
                                });
                            }

                            /* 넓은 병합 셀을 대표 라벨 위치로 사용하면 가독성이 가장 좋음 */
                            const representative = component.reduce((best, current) =>
                                current.area > best.area ? current : best
                            );

                            component.forEach(current => {
                                const shouldShow = current === representative;
                                const currentText = normalizeText(current.td.textContent);
                                if (shouldShow) {
                                    delete current.td.dataset.cwLoungeHidden;
                                    ensureCellLabel(current.td, current.label, false);
                                    current.td.setAttribute('aria-label', current.label);
                                    current.td.dataset.cwLoungeRepresentative = 'true';
                                } else {
                                    current.td.dataset.cwLoungeHidden = 'true';
                                    if (current.td.childNodes.length) current.td.replaceChildren();
                                    current.td.removeAttribute('aria-label');
                                    delete current.td.dataset.cwLoungeRepresentative;
                                }
                            });
                        });
                    });
                };

                const patchFloorplan = () => {
                    if (!floorplan || floorplanPatching) return;
                    floorplanPatching = true;
                    try {
                        const tab = getActiveTab();
                        const facilityNames = facilityNamesByTab.get(tab) || new Set();
                        const baseFont = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--seat-font-size')) || 10;
                        const cells = floorplan.querySelectorAll('td');
                        let needsLoungeDedupe = false;

                        cells.forEach(td => {
                            const storedLoungeLabel = normalizeText(td.dataset.cwLoungeLabel || '');
                            const existingLabel = td.querySelector(':scope > .cw-cell-label');
                            let text = normalizeText(existingLabel?.textContent || td.textContent) || storedLoungeLabel;
                            if (!text) return;

                            const forceHorizontal = shouldForceHorizontal(tab, text);
                            const isNormalTeamHorizontal = isWoorimNormalTeamLabel(tab, text);
                            const isFacility = (!isNormalTeamHorizontal && forceHorizontal) || facilityNames.has(text) || isFacilityHeuristic(text);
                            const patchKey = `${tab}|${baseFont}|${forceHorizontal ? 1 : 0}|${isFacility ? 1 : 0}|${text}`;

                            /* Repeated MutationObserver/tab callbacks become near-no-op for unchanged cells. */
                            if (td.dataset.cwPatchKey === patchKey) return;

                            if (forceHorizontal) td.classList.add('cw-force-horizontal');

                            /* 가로 고정 대상은 기존 <br>, block span, writing-mode 영향을 없애고 전용 span으로 재구성 */
                            if (forceHorizontal) {
                                ensureCellLabel(td, text, true);
                            }

                            /* 우림 4개 팀명은 가로표기 대상이지만 시설로 분류하지 않는다. */
                            td.classList.toggle('cw-facility-cell', !!isFacility);

                            if (isNormalTeamHorizontal) {
                                const label = ensureCellLabel(td, text, true);
                                td.style.fontSize = `${baseFont}px`;
                                if (label) {
                                    label.style.fontSize = `${baseFont}px`;
                                    label.style.maxWidth = `${Math.max(4, td.clientWidth - 6)}px`;
                                    label.style.maxHeight = `${Math.max(4, td.clientHeight - 4)}px`;
                                }
                            }

                            if (text.includes('라운지')) {
                                td.classList.add('cw-lounge-cell');
                                if (!td.dataset.cwLoungeLabel) td.dataset.cwLoungeLabel = text;
                                needsLoungeDedupe = true;
                            }
                            if (/비상\s*계단/.test(text)) td.classList.add('cw-emergency-stair-cell');

                            td.dataset.cwPatchKey = patchKey;

                            /* 라운지 중복 숨김 셀은 라벨을 다시 만들지 않음 */
                            if (td.dataset.cwLoungeHidden === 'true') return;

                            if (isFacility || (forceHorizontal && !isNormalTeamHorizontal)) {
                                /* 시설은 팀/부서보다 확실히 크게: 최대 18px에서 시작해 셀에 맞게 자동 축소 */
                                const preferred = Math.max(baseFont + 4, 18);
                                fitCellText(td, text, forceHorizontal, preferred);
                            }
                        });

                        if (needsLoungeDedupe) requestAnimationFrame(dedupeLoungeLabels);
                    } finally {
                        floorplanPatching = false;
                    }
                };

                const scheduleFloorplanPatch = (delay = 90) => {
                    clearTimeout(floorplanPatchTimer);
                    floorplanPatchTimer = setTimeout(() => requestAnimationFrame(patchFloorplan), delay);
                };

                if (dirContent) {
                    let directoryRestoreTimer = null;
                    new MutationObserver(() => {
                        scheduleDirectoryPatch();
                        clearTimeout(directoryRestoreTimer);
                        directoryRestoreTimer = setTimeout(() => {
                            const btn = document.getElementById('toggleDirBtn');
                            if (btn?.getAttribute('aria-expanded') === 'true' && !directoryHasSections()) renderDirectoryContent();
                        }, 90);
                    }).observe(dirContent, { childList: true, subtree: false });
                    scheduleDirectoryPatch();
                }

                const dirPanel = document.getElementById('dirPanel');
                const toggleDirBtn = document.getElementById('toggleDirBtn');
                if (dirPanel && toggleDirBtn) {
                    const applyDirectoryState = (open) => {
                        dirPanel.classList.toggle('hidden', !open);
                        dirPanel.style.display = open ? 'block' : 'none';
                        toggleDirBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
                        if (open) {
                            renderDirectoryContent();
                            scheduleDirectoryPatch();
                            setTimeout(() => { ensureDirectoryRendered(); scheduleDirectoryPatch(); }, 120);
                            setTimeout(ensureDirectoryRendered, 260);
                        }
                        window.dispatchEvent(new Event('resize'));
                    };

                    /* 초기 상태를 명확히 고정 */
                    applyDirectoryState(false);

                    /*
                     * app.js에도 같은 버튼의 click 핸들러가 존재하므로 capture 단계에서
                     * 사용자가 의도한 '다음 상태'를 먼저 기억한다. 이후 app.js가 리스트를
                     * 렌더링/토글하도록 두고, 마지막에 좌측 사이드바 상태만 확정한다.
                     * 이렇게 해야 app.js와 index 보정 코드가 서로 한 번씩 토글해 다시 닫히는
                     * 현상을 방지할 수 있다.
                     */
                    toggleDirBtn.addEventListener('click', () => {
                        const wasOpen = toggleDirBtn.getAttribute('aria-expanded') === 'true';
                        const shouldOpen = !wasOpen;
                        setTimeout(() => {
                            applyDirectoryState(shouldOpen);
                            /* app.js의 렌더가 한 프레임 늦게 끝나는 경우까지 보정 */
                            if (shouldOpen) {
                                requestAnimationFrame(() => applyDirectoryState(true));
                                setTimeout(() => applyDirectoryState(true), 120);
                            }
                        }, 0);
                    }, true);
                }
                if (floorplan) {
                    /*
                     * Observe only direct floorplan replacements. The old subtree observer also saw
                     * our own label/class DOM edits and recursively scheduled full 5k~8k-cell passes.
                     */
                    new MutationObserver(() => {
                        if (!floorplanPatching) scheduleFloorplanPatch(80);
                    }).observe(floorplan, { childList: true, subtree: false });
                    scheduleFloorplanPatch(40);
                }

                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        setTimeout(() => {
                            if (toggleDirBtn?.getAttribute('aria-expanded') === 'true') { renderDirectoryContent(); ensureDirectoryRendered(); }
                            scheduleDirectoryPatch();
                            scheduleFloorplanPatch();
                        }, 140);
                    });
                });

                ['fontDecreaseBtn', 'fontResetBtn', 'fontIncreaseBtn'].forEach(id => {
                    document.getElementById(id)?.addEventListener('click', () => setTimeout(scheduleFloorplanPatch, 50));
                });

                /* -------------------- 모바일/웹 공통 안정 검색 -------------------- */
                const setupStableSearch = () => {
                    const oldInput = document.getElementById('searchInput');
                    const oldClear = document.getElementById('clearSearchBtn');
                    const oldPopup = document.getElementById('searchPopup');
                    const searchBox = document.getElementById('searchBox');
                    if (!oldInput || !oldPopup || !searchBox) return;

                    /* 기존 search.js가 등록한 키/조합 이벤트를 제거하기 위해 노드를 교체하고 독립적으로 제어 */
                    const input = oldInput.cloneNode(true);
                    oldInput.replaceWith(input);
                    input.placeholder = '이름 또는 부서 검색 (동명이인은 풀네임 입력 후 선택)';
                    input.setAttribute('autocomplete', 'off');
                    input.setAttribute('autocorrect', 'off');
                    input.setAttribute('spellcheck', 'false');

                    let clearBtn = oldClear;
                    if (oldClear) {
                        clearBtn = oldClear.cloneNode(true);
                        oldClear.replaceWith(clearBtn);
                    }

                    const popup = oldPopup.cloneNode(false);
                    oldPopup.replaceWith(popup);
                    popup.innerHTML = '<div id="searchSummary" role="status" aria-live="polite"></div><div id="searchResults" role="listbox" aria-label="검색 결과"></div>';
                    popup.hidden = true;
                    searchBox.appendChild(popup);

                    const summary = popup.querySelector('#searchSummary');
                    const resultsEl = popup.querySelector('#searchResults');
                    let searchIndex = [];
                    try {
                        const embeddedEl = document.getElementById('cw-embedded-search-index');
                        const embedded = embeddedEl ? JSON.parse(embeddedEl.textContent || '[]') : [];
                        if (Array.isArray(embedded)) {
                            searchIndex = embedded.map(item => ({
                                ...item,
                                key: keyText(item?.text ?? item?.key ?? '')
                            }));
                        }
                    } catch (err) {
                        console.warn('[통합검색] 내장 검색 인덱스 로드 실패', err);
                    }
                    let isComposing = false;
                    let highlightedIndex = -1;
                    let loadFinished = searchIndex.length > 0;

                    const fetchFirstAvailable = async (candidates) => {
                        for (const file of candidates) {
                            try {
                                const response = await fetch(file, { cache: 'no-store' });
                                if (response.ok) return { file, buffer: await response.arrayBuffer() };
                            } catch (_) { /* 다음 후보 시도 */ }
                        }
                        return null;
                    };

                    const buildSearchIndex = async () => {
                        if (!window.XLSX) {
                            await new Promise(resolve => {
                                const started = Date.now();
                                const timer = setInterval(() => {
                                    if (window.XLSX || Date.now() - started > 5000) {
                                        clearInterval(timer);
                                        resolve();
                                    }
                                }, 100);
                            });
                        }
                        if (!window.XLSX) {
                            loadFinished = true;
                            return;
                        }

                        const all = [];
                        const loadedTabs = new Set();
                        await Promise.all(Object.entries(OFFICE_FILES).map(async ([tab, files]) => {
                            const loaded = await fetchFirstAvailable(files);
                            if (!loaded) return;
                            try {
                                const wb = XLSX.read(loaded.buffer, { type: 'array', cellText: true });
                                const sheetName = wb.SheetNames[0];
                                const ws = wb.Sheets[sheetName];
                                if (!ws?.['!ref']) return;
                                const range = XLSX.utils.decode_range(ws['!ref']);
                                loadedTabs.add(tab);
                                for (let r = range.s.r; r <= range.e.r; r++) {
                                    for (let c = range.s.c; c <= range.e.c; c++) {
                                        const address = XLSX.utils.encode_cell({ r, c });
                                        const cell = ws[address];
                                        if (!cell) continue;
                                        const text = normalizeText(cell.w ?? cell.v);
                                        if (!text || text === '0' || text === '1' || /^[-+]?\d+(\.\d+)?$/.test(text)) continue;
                                        all.push({
                                            tab,
                                            office: OFFICE_LABELS[tab] || tab,
                                            address,
                                            row: r,
                                            col: c,
                                            text,
                                            key: keyText(text)
                                        });
                                    }
                                }
                            } catch (err) {
                                console.warn(`[검색 인덱스] ${tab} 로드 실패`, err);
                            }
                        }));

                        /* 서버에서 읽힌 탭은 최신 XLSX 데이터로, 실패한 탭은 HTML 내장 인덱스로 유지 */
                        const combined = [
                            ...searchIndex.filter(item => !loadedTabs.has(item.tab)),
                            ...all
                        ];
                        const unique = new Map();
                        combined.forEach(item => unique.set(`${item.tab}|${item.address}|${item.key}`, item));
                        searchIndex = [...unique.values()];
                        loadFinished = true;
                        if (input.value.trim()) renderResults();
                    };

                    const fallbackActiveDomResults = (query) => {
                        const tab = getActiveTab();
                        const q = keyText(query);
                        const arr = [];
                        floorplan?.querySelectorAll('td').forEach((td, i) => {
                            const text = normalizeText(td.textContent);
                            if (text && keyText(text).includes(q)) {
                                arr.push({ tab, office: OFFICE_LABELS[tab] || tab, address: `DOM-${i}`, row: i, col: 0, text, key: keyText(text), domOnly: true });
                            }
                        });
                        return arr.slice(0, 12);
                    };

                    const getMatches = (query) => {
                        const q = keyText(query);
                        if (!q) return { items: [], exact: false, exactCount: 0 };
                        const source = searchIndex.length ? searchIndex : fallbackActiveDomResults(query);
                        if (q.length < 2) return { items: [], exact: false, exactCount: 0 };

                        /* 정확히 일치하는 이름이 있어도 같은 문자열로 시작하는 다른 이름을 함께 표시한다.
                           예: '이건' 검색 시 '이건' + '이건석' 모두 노출, 정확일치는 최상단 배치. */
                        const matches = source.filter(item => item.key.includes(q));
                        const exactCount = matches.filter(item => item.key === q).length;
                        const dedup = new Map();
                        matches
                            .sort((a,b) => {
                                const ae = a.key === q ? 0 : 1;
                                const be = b.key === q ? 0 : 1;
                                if (ae !== be) return ae - be;
                                const as = a.key.startsWith(q) ? 0 : 1;
                                const bs = b.key.startsWith(q) ? 0 : 1;
                                return as - bs || a.text.length - b.text.length || a.office.localeCompare(b.office, 'ko') || a.row - b.row || a.col - b.col;
                            })
                            .forEach(item => {
                                const k = `${item.tab}|${item.key}`;
                                if (!dedup.has(k)) dedup.set(k, item);
                            });
                        return { exact: exactCount > 0, exactCount, items: [...dedup.values()].slice(0, 20) };
                    };

                    const hidePopup = () => {
                        popup.hidden = true;
                        input.setAttribute('aria-expanded', 'false');
                        highlightedIndex = -1;
                    };

                    const updateKeyboardSelection = () => {
                        const buttons = [...resultsEl.querySelectorAll('.cw-search-result')];
                        buttons.forEach((btn, i) => btn.setAttribute('aria-selected', i === highlightedIndex ? 'true' : 'false'));
                        buttons[highlightedIndex]?.scrollIntoView({ block: 'nearest' });
                    };

                    const highlightEntry = (entry, attempt = 0) => {
                        if (!floorplan) return;
                        document.querySelectorAll('.active-match,.highlight-seat').forEach(el => el.classList.remove('active-match', 'highlight-seat'));

                        const sameTextEntries = searchIndex
                            .filter(x => x.tab === entry.tab && x.key === entry.key)
                            .sort((a,b) => a.row - b.row || a.col - b.col);
                        const occurrence = Math.max(0, sameTextEntries.findIndex(x => x.address === entry.address));

                        const exactCells = [...floorplan.querySelectorAll('td')].filter(td => keyText(td.textContent) === entry.key);
                        const target = exactCells[Math.min(occurrence, Math.max(0, exactCells.length - 1))];

                        if (!target && attempt < 14) {
                            setTimeout(() => highlightEntry(entry, attempt + 1), 160);
                            return;
                        }
                        if (!target) return;

                        target.classList.add('active-match');
                        target.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
                        setTimeout(() => target.classList.remove('active-match'), 3200);
                    };

                    const jumpToEntry = (entry) => {
                        hidePopup();
                        const tabBtn = document.querySelector(`.tab-btn[data-tab="${entry.tab}"]`);
                        const isCurrent = getActiveTab() === entry.tab;
                        if (!isCurrent && tabBtn) tabBtn.click();
                        setTimeout(() => highlightEntry(entry), isCurrent ? 60 : 380);
                    };

                    const renderResults = () => {
                        if (isComposing) return;
                        const query = normalizeText(input.value);
                        if (clearBtn) clearBtn.classList.toggle('hidden', !query);
                        if (!query) {
                            hidePopup();
                            return;
                        }

                        const { items, exact, exactCount = 0 } = getMatches(query);
                        resultsEl.innerHTML = '';
                        highlightedIndex = -1;

                        if (!items.length) {
                            summary.textContent = loadFinished ? '검색 결과가 없습니다.' : '검색 데이터를 준비 중입니다…';
                            popup.hidden = false;
                            input.setAttribute('aria-expanded', 'true');
                            return;
                        }

                        if (exactCount > 1) {
                            summary.textContent = `정확히 일치 ${exactCount}건 · 전체 검색 결과 ${items.length}건`;
                        } else if (exactCount === 1 && items.length === 1) {
                            summary.textContent = '정확히 일치하는 결과';
                        } else {
                            summary.textContent = `검색 결과 ${items.length}건`;
                        }

                        items.forEach(entry => {
                            const button = document.createElement('button');
                            button.type = 'button';
                            button.className = 'cw-search-result';
                            button.setAttribute('role', 'option');
                            button.setAttribute('aria-selected', 'false');
                            button.innerHTML = `<span class="cw-result-main"></span><span class="cw-result-meta"></span>`;
                            button.querySelector('.cw-result-main').textContent = entry.text;
                            button.querySelector('.cw-result-meta').textContent = entry.office;
                            button.addEventListener('mousedown', e => e.preventDefault());
                            button.addEventListener('click', () => jumpToEntry(entry));
                            resultsEl.appendChild(button);
                        });

                        popup.hidden = false;
                        input.setAttribute('aria-expanded', 'true');
                    };

                    /* iOS Safari 한글 IME는 입력 중 DOM을 즉시 갱신하면 삭제 시 caret이 튀는 경우가 있어
                       조합 중에는 결과 DOM을 건드리지 않고, 조합 종료/입력 후 짧게 지연해 갱신한다. */
                    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                    let searchRenderTimer = null;
                    let searchRaf = 0;
                    const queueSearchRender = (delay = 0) => {
                        if (searchRenderTimer) clearTimeout(searchRenderTimer);
                        if (searchRaf) cancelAnimationFrame(searchRaf);
                        if (isIOS) {
                            searchRenderTimer = setTimeout(() => {
                                searchRenderTimer = null;
                                if (!isComposing) renderResults();
                            }, Math.max(90, delay));
                        } else if (delay > 0) {
                            searchRenderTimer = setTimeout(() => {
                                searchRenderTimer = null;
                                if (!isComposing) renderResults();
                            }, delay);
                        } else {
                            searchRaf = requestAnimationFrame(() => {
                                searchRaf = 0;
                                if (!isComposing) renderResults();
                            });
                        }
                    };

                    input.addEventListener('compositionstart', () => {
                        isComposing = true;
                        if (searchRenderTimer) clearTimeout(searchRenderTimer);
                        if (searchRaf) cancelAnimationFrame(searchRaf);
                    });
                    input.addEventListener('compositionend', () => {
                        isComposing = false;
                        queueSearchRender(isIOS ? 120 : 0);
                    });
                    input.addEventListener('input', e => {
                        if (e.isComposing || isComposing) return;
                        /* input.value / selectionStart / focus를 변경하지 않는다. */
                        queueSearchRender(isIOS ? 120 : 0);
                    });
                    input.addEventListener('focus', () => { if (input.value.trim()) renderResults(); });
                    input.addEventListener('keydown', e => {
                        if (e.key === 'Escape') {
                            hidePopup();
                            return;
                        }
                        const buttons = [...resultsEl.querySelectorAll('.cw-search-result')];
                        if (!buttons.length) return;
                        if (e.key === 'ArrowDown') {
                            e.preventDefault();
                            highlightedIndex = Math.min(buttons.length - 1, highlightedIndex + 1);
                            updateKeyboardSelection();
                        } else if (e.key === 'ArrowUp') {
                            e.preventDefault();
                            highlightedIndex = Math.max(0, highlightedIndex - 1);
                            updateKeyboardSelection();
                        } else if (e.key === 'Enter') {
                            e.preventDefault();
                            if (highlightedIndex >= 0) {
                                buttons[highlightedIndex].click();
                                return;
                            }
                            const matches = getMatches(input.value);
                            if (matches.exact && matches.items.length === 1) jumpToEntry(matches.items[0]);
                            else renderResults();
                        }
                    });

                    clearBtn?.addEventListener('click', e => {
                        e.preventDefault();
                        input.value = '';
                        input.focus();
                        hidePopup();
                        clearBtn.classList.add('hidden');
                    });

                    document.addEventListener('pointerdown', e => {
                        if (!searchBox.contains(e.target)) hidePopup();
                    });

                    /*
                     * The embedded index is already complete in this HTML. Parsing all five XLSX
                     * files again on the main thread causes visible freezes on iOS. Mobile/touch
                     * devices keep the embedded index; desktop may refresh it during idle time.
                     */
                    const constrainedDevice = window.matchMedia?.('(pointer: coarse)').matches || window.innerWidth <= 900;
                    if (!searchIndex.length) {
                        buildSearchIndex();
                    } else if (!constrainedDevice) {
                        const refresh = () => buildSearchIndex();
                        if ('requestIdleCallback' in window) requestIdleCallback(refresh, { timeout: 5000 });
                        else setTimeout(refresh, 2500);
                    }
                };

                setupStableSearch();

                /* -------------------- 엑셀 저장 파일명 안정화 -------------------- */
                const setupExcelDownloadPatch = () => {
                    if (!window.XLSX?.writeFile || window.XLSX._cwPatchedWriteFile) return;
                    const originalWriteFile = window.XLSX.writeFile;
                    window.XLSX.writeFile = function(workbook, filename, opts) {
                        const currentTabId = getActiveTab();
                        if (currentTabId) filename = `${currentTabId}.xlsx`;
                        return originalWriteFile.call(this, workbook, filename, opts);
                    };
                    window.XLSX._cwPatchedWriteFile = true;
                };

                if (window.XLSX) setupExcelDownloadPatch();
                else {
                    const timer = setInterval(() => {
                        if (window.XLSX) {
                            setupExcelDownloadPatch();
                            clearInterval(timer);
                        }
                    }, 200);
                    setTimeout(() => clearInterval(timer), 10000);
                }
            });
        })();
    </script>

<script id="cw-sidebar-final-controller">
(function(){
  const q=s=>document.querySelector(s);
  const clean=s=>(s||'').replace(/\s+/g,' ').trim();
  const officeLabels={daerung:'대륭',woorim:'우림',dk18:'가산DK 18F',dk17:'가산DK 17F',gplus:'지플러스'};
  const facilityRe=/(회의실|라운지|엘리베이터|화장실|휴게실|샤워실|세미나실|교육장|카페테리아|창고|출입문|메일룸|탕비실|치카룸|수면실|응접실|프로젝트룸|시스템실|OA|TEST\s*ROOM|복합기|정수기|원두머신|비상계단|분리수거)/i;
  const roomCode=(tab,t)=>{
    const x=clean(t).replace(/\s+/g,'').toUpperCase();
    if(tab==='daerung') return /^[A-C]\d{3}[A-Z]?$/.test(x);
    if(tab==='woorim') return /^(?:401|402|601|602|603|604|605|801)$/.test(x);
    if(tab==='dk18'||tab==='dk17') return /^[AB]\d{3,4}$/.test(x) || x==='A1201';
    return false;
  };
  const isDept=t=>{
    const x=clean(t);
    if(!x||x.length>40||facilityRe.test(x)) return false;
    if(/(대표실|임원실|시스템실|메일룸|탕비실|치카룸|수면실|응접실)$/i.test(x)) return false;
    return /(팀|본부|센터|파트|그룹|사업부|사업본부|TF|실)$/i.test(x);
  };
  function activeTab(){
    return q('.tab-btn.bg-\\[\\#4F81BD\\]')?.dataset.tab || q('.tab-btn[aria-selected="true"]')?.dataset.tab || document.body.dataset.office || 'daerung';
  }
  function embedded(){
    try{return JSON.parse(q('#cw-embedded-search-index')?.textContent||'[]')}catch(_){return []}
  }
  function build(tab){
    const vals=new Set();
    const indexed=embedded().filter(x=>x&&x.tab===tab);
    indexed.forEach(x=>{const t=clean(x.text); if(t) vals.add(t)});
    const admin=q('#adminControls');
    if(!indexed.length || (admin && !admin.classList.contains('hidden'))){
      q('#dynamicFloorplan')?.querySelectorAll('td').forEach(td=>{const t=clean(td.textContent); if(t) vals.add(t)});
    }
    const depts=new Set(), facs=new Set();
    const excludes=new Set(['0','1','A','B','C','D','E','F','G','부서 및 팀','회의실 및 시설']);
    const perTab={daerung:new Set(['실외기','실외기실']),woorim:new Set(['실외기','실외기실']),dk18:new Set([]),dk17:new Set([]),gplus:new Set([])}[tab]||new Set();
    vals.forEach(t=>{
      if(!t||excludes.has(t)||perTab.has(t)) return;
      if(/^[-+]?\d+(?:\.\d+)?$/.test(t) && !roomCode(tab,t)) return;
      if(facilityRe.test(t)||roomCode(tab,t)||/^(?:부문대표실|총괄대표실|사업대표실|대표실|임원실|GA창고|공용창고|오픈형 창고)$/i.test(t)) facs.add(t);
      else if(isDept(t)) depts.add(t);
    });
    const sorter=(a,b)=>a.localeCompare(b,'ko',{numeric:true,sensitivity:'base'});
    return {depts:[...depts].sort(sorter),facs:[...facs].sort(sorter)};
  }
  function item(name){
    const b=document.createElement('button');
    b.type='button'; b.className='cw-dir-item'; b.textContent=name;
    b.addEventListener('click',()=>{
      const input=q('#searchInput');
      if(input){input.value=name; input.dispatchEvent(new Event('input',{bubbles:true})); input.focus();}
    });
    return b;
  }
  function section(title,names,kind){
    const s=document.createElement('section'); s.className='cw-dir-section'; s.dataset.kind=kind;
    const h=document.createElement('div'); h.className='cw-dir-title';
    const span=document.createElement('span'); span.textContent=title;
    const count=document.createElement('span'); count.className='cw-dir-count'; count.textContent=String(names.length);
    h.append(span,count);
    const l=document.createElement('div'); l.className='cw-dir-list';
    if(!names.length){const e=document.createElement('div');e.className='cw-dir-empty';e.textContent='표시할 항목이 없습니다.';l.appendChild(e)}
    else names.forEach(n=>l.appendChild(item(n)));
    s.append(h,l); return s;
  }
  function ensurePlacement(){
    const shell=q('#workspaceShell'), panel=q('#dirPanel'), viewport=q('#viewport');
    if(!shell||!panel||!viewport) return;
    if(panel.parentElement!==shell || shell.firstElementChild!==panel) shell.insertBefore(panel,viewport);
  }
  function render(){
    const c=q('#dirContent'); if(!c) return;
    const {depts,facs}=build(activeTab());
    c.replaceChildren(section('부서 및 팀',depts,'department'),section('회의실 및 시설',facs,'facility'));
    c.scrollTop=0; q('#dirPanel').scrollTop=0;
  }
  function setOpen(open){
    ensurePlacement();
    const p=q('#dirPanel'), b=q('#toggleDirBtn'); if(!p||!b) return;
    p.classList.toggle('hidden',!open);
    p.style.display=open?'block':'none';
    b.setAttribute('aria-expanded',open?'true':'false');
    if(open){render(); p.scrollTop=0; q('#dirContent').scrollTop=0;}
    window.dispatchEvent(new Event('resize'));
  }
  document.addEventListener('DOMContentLoaded',()=>{
    ensurePlacement(); setOpen(false);
    /* 기존 app.js / 보정 스크립트의 클릭 핸들러보다 먼저 처리 */
    document.addEventListener('click',e=>{
      const btn=e.target.closest&&e.target.closest('#toggleDirBtn');
      if(!btn) return;
      e.preventDefault(); e.stopImmediatePropagation();
      const open=btn.getAttribute('aria-expanded')!=='true';
      setOpen(open);
    },true);
    document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click',()=>{
      setTimeout(()=>{ensurePlacement(); if(q('#toggleDirBtn')?.getAttribute('aria-expanded')==='true') render();},180);
    }));
    const shell=q('#workspaceShell');
    if(shell) new MutationObserver(()=>ensurePlacement()).observe(shell,{childList:true});
  });
})();
</script>

<script id="cw-directory-click-highlight-fix">
(function(){
  const normalize=value=>String(value||'').replace(/\u00a0/g,' ').replace(/\s+/g,'').trim().toLowerCase();
  const getCellText=td=>{if(!td)return'';const label=td.querySelector(':scope > .cw-cell-label');return label?label.textContent:(td.dataset.cwLoungeLabel||td.textContent||'');};
  let clearTimer=null;
  function clearDirectoryHighlights(){document.querySelectorAll('#dynamicFloorplan td.cw-directory-highlight').forEach(td=>td.classList.remove('cw-directory-highlight'));}
  function highlightDirectoryTarget(name,attempt=0){
    const floorplan=document.getElementById('dynamicFloorplan'); if(!floorplan)return;
    const key=normalize(name); if(!key)return;
    clearDirectoryHighlights();
    const cells=[...floorplan.querySelectorAll('td')].filter(td=>normalize(getCellText(td))===key);
    if(!cells.length&&attempt<8){setTimeout(()=>highlightDirectoryTarget(name,attempt+1),120);return;}
    if(!cells.length)return;
    cells.forEach(td=>td.classList.add('cw-directory-highlight'));
    const first=cells[0]; requestAnimationFrame(()=>first.scrollIntoView({behavior:'smooth',block:'center',inline:'center'}));
    if(clearTimer)clearTimeout(clearTimer); clearTimer=setTimeout(clearDirectoryHighlights,3800);
  }
  document.addEventListener('click',function(e){
    const item=e.target&&e.target.closest?e.target.closest('.cw-dir-item'):null; if(!item)return;
    const panel=document.getElementById('dirPanel'); if(!panel||!panel.contains(item))return;
    const name=(item.dataset.directoryName||item.textContent||'').trim(); if(!name)return;
    e.preventDefault(); e.stopImmediatePropagation();
    const input=document.getElementById('searchInput');
    if(input){input.value=name; const clearBtn=document.getElementById('clearSearchBtn'); if(clearBtn)clearBtn.classList.remove('hidden'); input.setAttribute('aria-expanded','false');}
    const popup=document.getElementById('searchPopup'); if(popup)popup.hidden=true;
    highlightDirectoryTarget(name);
  },true);
  document.addEventListener('input',function(e){if(e.target&&e.target.id==='searchInput')clearDirectoryHighlights();},true);
})();
</script>

    <script id="cw-secure-download-gate">
    (() => {
        const isAdminModeActive = () => {
            const controls = document.getElementById('adminControls');
            if (!controls) return false;
            const style = window.getComputedStyle(controls);
            return !controls.classList.contains('hidden') &&
                   style.display !== 'none' &&
                   style.visibility !== 'hidden';
        };

        const syncDownloadButton = () => {
            const button = document.getElementById('downloadExcelBtn');
            if (!button) return;
            const allowed = isAdminModeActive();
            button.classList.toggle('hidden', !allowed);
            button.style.display = allowed ? 'flex' : 'none';
            button.setAttribute('aria-hidden', allowed ? 'false' : 'true');
            button.tabIndex = allowed ? 0 : -1;
        };

        const bindDownloadGuard = () => {
            const button = document.getElementById('downloadExcelBtn');
            if (!button || button.dataset.adminOnlyDownloadBound === 'true') return;
            button.dataset.adminOnlyDownloadBound = 'true';
            /* 숨김 상태에서 스크립트 등으로 클릭이 발생해도 다운로드를 차단한다. */
            button.addEventListener('click', (event) => {
                if (isAdminModeActive()) return;
                event.preventDefault();
                event.stopPropagation();
                event.stopImmediatePropagation();
            }, true);
        };

        const init = () => {
            bindDownloadGuard();
            syncDownloadButton();

            const controls = document.getElementById('adminControls');
            if (controls) {
                new MutationObserver(syncDownloadButton).observe(controls, {
                    attributes: true,
                    attributeFilter: ['class', 'style', 'hidden']
                });
            }

            const adminBtn = document.getElementById('adminLoginBtn');
            adminBtn?.addEventListener('click', () => {
                setTimeout(syncDownloadButton, 0);
                setTimeout(syncDownloadButton, 120);
                setTimeout(syncDownloadButton, 400);
            });

            /* 관리자 UI가 있는 작은 header 영역만 감시해 지도 DOM 변경 비용을 차단 */
            const header = document.querySelector('header');
            if (header) {
                new MutationObserver(() => {
                    bindDownloadGuard();
                    syncDownloadButton();
                }).observe(header, { childList: true, subtree: true });
            }
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init, { once: true });
        } else {
            init();
        }
    })();
    </script>



<script id="cw-gplus-door-opening-fix-script-v2">
(() => {
    const floorplan = document.getElementById('dynamicFloorplan');
    if (!floorplan) return;

    const normalize = (value) =>
        String(value ?? '')
            .replace(/\u00a0/g, ' ')
            .replace(/\s+/g, '')
            .trim();

    const getCellText = (td) => {
        const label = td.querySelector(':scope > .cw-cell-label');
        return normalize(label?.textContent || td.dataset.cwLoungeLabel || td.textContent || '');
    };

    /*
     * Do not rely on body[data-office].
     * app.js changes the active tab button but body.data-office can remain "daerung".
     */
    const getActiveTab = () => {
        const buttons = [...document.querySelectorAll('.tab-btn[data-tab]')];

        const selected = buttons.find(btn => btn.getAttribute('aria-selected') === 'true');
        if (selected) return selected.dataset.tab || '';

        const blue = buttons.find(btn =>
            btn.classList.contains('bg-[#4F81BD]') ||
            btn.classList.contains('text-white')
        );
        if (blue) return blue.dataset.tab || '';

        return document.body?.dataset?.office || '';
    };

    const clearDoorClasses = () => {
        floorplan.querySelectorAll('.cw-gplus-door-horizontal, .cw-gplus-door-vertical')
            .forEach(td => {
                td.classList.remove('cw-gplus-door-horizontal', 'cw-gplus-door-vertical');
            });
    };

    const applyDoorOpenings = () => {
        clearDoorClasses();
        if (getActiveTab() !== 'gplus') return;

        floorplan.querySelectorAll('td').forEach(td => {
            if (getCellText(td) !== '출입문') return;

            /*
             * The source workbook contains two kinds of entrance merged cells:
             * - horizontal: colspan > rowspan  -> break top/bottom wall
             * - vertical:   rowspan > colspan -> break left/right wall
             *
             * This mirrors how the GPlus Excel file expresses an open doorway.
             */
            const colspan = Number(td.colSpan || 1);
            const rowspan = Number(td.rowSpan || 1);

            if (rowspan > colspan) {
                td.classList.add('cw-gplus-door-vertical');
            } else {
                td.classList.add('cw-gplus-door-horizontal');
            }
        });
    };

    let timer = null;
    const schedule = (delay = 30) => {
        clearTimeout(timer);
        timer = setTimeout(() => requestAnimationFrame(applyDoorOpenings), delay);
    };

    new MutationObserver(() => schedule(80)).observe(floorplan, {
        childList: true,
        subtree: false
    });

    document.querySelectorAll('.tab-btn[data-tab]').forEach(btn => {
        btn.addEventListener('click', () => schedule(140));
    });

    window.addEventListener('load', () => schedule(80), { once: true });

    applyDoorOpenings();
})();
</script>


<script id="cw-map-interaction-performance">
(() => {
    const viewport = document.getElementById('viewport');
    if (!viewport) return;

    let endTimer = 0;
    const begin = () => {
        document.body.classList.add('cw-map-interacting');
        clearTimeout(endTimer);
    };
    const endSoon = () => {
        clearTimeout(endTimer);
        endTimer = setTimeout(() => document.body.classList.remove('cw-map-interacting'), 120);
    };

    viewport.addEventListener('pointerdown', begin, { passive: true });
    window.addEventListener('pointerup', endSoon, { passive: true });
    window.addEventListener('pointercancel', endSoon, { passive: true });
    viewport.addEventListener('wheel', () => { begin(); endSoon(); }, { passive: true });
    viewport.addEventListener('touchstart', begin, { passive: true });
    viewport.addEventListener('touchend', endSoon, { passive: true });
    viewport.addEventListener('touchcancel', endSoon, { passive: true });
})();
</script>
