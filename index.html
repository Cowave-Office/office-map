<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>커넥트웨이브 통합 공간배치도 통합 좌석 및 시설 안내</title>
    <meta name="robots" content="noindex, nofollow">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

    <script>
        // ReferenceError 방지를 위한 안전한 초기화 (CDN 로드 지연 시 대비)
        window.tailwind = window.tailwind || {};
        window.tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Noto Sans KR', 'sans-serif'] },
                    colors: { themeBlue: '#4F81BD' }
                }
            }
        };
    </script>

    <style>
        :root { 
            --print-scale: 0.6; 
            --seat-font-size: 10px; /* 글자 크기 변수화 */
        }
        
        body { -webkit-font-smoothing: antialiased; touch-action: none; /* 모바일 브라우저 기본 제스처 방지 */ }
        .fa-solid { color: #4F81BD !important; }
        
        .header-icon { color: #4F81BD !important; }
        .text-stone-400 .fa-solid { color: #a8a29e !important; }
        .text-stone-500.fa-solid { color: #78716c !important; }
        .text-white .fa-solid, .fa-print, .fa-key, .fa-file-import, .fa-file-excel { color: inherit !important; }

        .map-canvas-bg {
            background-color: #e5e2d8;
            background-image: radial-gradient(#cbc6b7 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        .grab-mode { cursor: grab; }
        .grabbing-mode { cursor: grabbing !important; }

        .excel-table-layout {
            border-collapse: collapse; 
            table-layout: fixed;
            margin: 0 auto;
        }

        .excel-table-layout td {
            height: 26px; padding: 0; margin: 0; 
            font-size: var(--seat-font-size); 
            font-weight: 700; text-align: center; vertical-align: middle; 
            color: #33302a; white-space: pre-wrap; word-break: keep-all; 
            line-height: 1.15; user-select: none; box-sizing: border-box; position: relative;
        }

        .seat-td { transition: all 0.15s ease-in-out; }
        .seat-td:hover {
            transform: translateY(-2px) scale(1.12);
            box-shadow: 0 8px 18px rgba(0,0,0,0.18);
            z-index: 50; position: relative;
            outline: 2.5px solid #4F81BD !important;
            border-color: transparent !important;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); outline: 0px solid rgba(79, 129, 189, 0.7); }
            50% { transform: scale(1.18); outline: 6px solid rgba(79, 129, 189, 0); }
            100% { transform: scale(1); outline: 0px solid rgba(79, 129, 189, 0); }
        }
        
        /* 일반 검색 결과 하이라이트 */
        .highlight-seat {
            animation: pulse-glow 1.2s infinite; z-index: 40 !important;
            border: 2px solid #4F81BD !important; background-color: #4F81BD !important;
            color: #ffffff !important; font-weight: 900 !important;
        }
        
        /* 엔터키로 포커스된 현재 타겟 좌석 하이라이트 (주황색) */
        .active-match {
            outline: 3px solid #f59e0b !important;
            background-color: #f59e0b !important;
            color: #ffffff !important;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
            z-index: 60 !important;
            transform: translateY(-2px) scale(1.15);
            animation: none !important;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #e5e2d8; }
        ::-webkit-scrollbar-thumb { background: #c5c0b2; }
        ::-webkit-scrollbar-thumb:hover { background: #a39e90; }

        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            header, #secondaryToolbar { display: none !important; }
            body, html, main#viewport { height: auto !important; overflow: visible !important; background: white !important; position: static !important; padding: 0 !important; }
            #floorplanContainer { transform: scale(var(--print-scale)) !important; transform-origin: top left !important; box-shadow: none !important; border: none !important; margin: 0 !important; padding: 0 !important; }
        }
    </style>
</head>
<body class="bg-stone-100 text-stone-800 h-screen flex flex-col overflow-hidden font-sans antialiased">

    <header class="bg-white border-b border-stone-200 px-6 py-3 flex flex-wrap items-center justify-between shadow-sm z-30 shrink-0">
        
        <div class="flex items-center gap-3.5 mb-2 md:mb-0">
            <div id="adminLoginBtn" class="p-2 bg-white text-[#4F81BD] rounded-xl shadow-sm border border-stone-200 cursor-pointer hover:bg-stone-50 transition" title="관리자 모드">
                <i class="fa-solid fa-building text-xl header-icon"></i>
            </div>
            <div>
                <h1 class="text-xl font-extrabold tracking-tight flex items-center gap-2.5 text-stone-800">
                    커넥트웨이브 통합 공간배치도 통합 좌석 및 시설 안내
                </h1>
                <p class="text-xs text-stone-500 flex items-center gap-1"><i class="fa-solid fa-lock text-stone-400 text-[10px]"></i> 사내 전용 보안 문서입니다.</p>
            </div>
        </div>

        <nav class="flex flex-wrap items-center gap-1.5 bg-stone-100 p-1.5 rounded-xl border border-stone-200 shadow-inner w-full md:w-auto overflow-x-auto">
            <button class="tab-btn bg-[#4F81BD] text-white font-bold shadow-md px-3.5 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1.5 whitespace-nowrap" data-tab="daerung">
                대륭(HQ, CC CTO, CISO)
            </button>
            <button class="tab-btn text-stone-500 hover:text-stone-700 hover:bg-stone-200 font-medium px-3.5 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1.5 whitespace-nowrap" data-tab="woorim">
                우림(메이크샵, 몰테일)
            </button>
            <button class="tab-btn text-stone-500 hover:text-stone-700 hover:bg-stone-200 font-medium px-3.5 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1.5 whitespace-nowrap" data-tab="dk18">
                가산DK 18F(CC사업부)
            </button>
            <button class="tab-btn text-stone-500 hover:text-stone-700 hover:bg-stone-200 font-medium px-3.5 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1.5 whitespace-nowrap" data-tab="dk17">
                가산DK 17F(CC사업부)
            </button>
            <button class="tab-btn text-stone-500 hover:text-stone-700 hover:bg-stone-200 font-medium px-3.5 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1.5 whitespace-nowrap" data-tab="gplus">
                지플러스(플레이오토)
            </button>
        </nav>

        <div class="flex items-center gap-2 mt-2 md:mt-0">
            <!-- 기본적으로 숨겨져 있으며, 관리자 로그인 시 나타납니다. -->
            <div id="adminControls" class="hidden flex items-center gap-2">
                <div class="flex items-center gap-1.5 bg-white border border-stone-300 px-2.5 py-1.5 rounded-lg shadow-sm">
                    <label for="printScaleInput" class="text-xs text-stone-600 font-bold cursor-pointer"><i class="fa-solid fa-down-left-and-up-right-to-center header-icon"></i> 인쇄 비율</label>
                    <div class="flex items-center bg-stone-100 border border-stone-300 rounded px-1.5 py-0.5">
                        <input type="number" id="printScaleInput" value="60" min="10" max="150" step="5" class="bg-transparent text-stone-800 text-xs w-9 text-right focus:outline-none font-bold">
                        <span class="text-stone-500 text-xs ml-0.5 font-bold">%</span>
                    </div>
                </div>

                <button onclick="window.print()" class="px-3.5 py-1.5 bg-white hover:bg-stone-50 text-stone-700 border border-[#4F81BD] text-xs font-bold rounded-lg transition shadow-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-print !text-[#4F81BD]"></i> 인쇄
                </button>

                <div class="w-px h-5 bg-stone-300 mx-1 hidden sm:block"></div>

                <button id="changePwBtn" class="px-3 py-1.5 bg-stone-800 hover:bg-stone-700 text-stone-200 text-xs font-bold rounded-lg transition shadow-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-key !text-stone-300"></i> PW 변경
                </button>
                <label for="excelInput" class="px-3 py-1.5 bg-stone-800 hover:bg-stone-700 text-stone-200 text-xs font-bold rounded-lg transition shadow-sm flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-file-import !text-stone-300"></i> 업로드
                </label>
                <input type="file" id="excelInput" accept=".xlsx, .xls, .csv" class="hidden" />
            </div>
        </div>
    </header>

    <div id="secondaryToolbar" class="bg-stone-50 shadow-sm z-20 relative flex flex-col border-b border-stone-200">
        <div class="py-2.5 px-4 md:px-6 flex flex-wrap items-center gap-3 md:gap-4">
            
            <button id="toggleDirBtn" class="h-[38px] px-4 bg-white hover:bg-stone-100 text-[#4F81BD] border border-[#4F81BD] rounded-lg text-sm font-bold transition flex items-center gap-2 shadow-sm whitespace-nowrap">
                <i class="fa-solid fa-list"></i> 전체 리스트
            </button>
            
            <div class="w-px h-6 bg-stone-300 hidden md:block"></div>
            
            <!-- 전 지점 통합 검색창 -->
            <div class="relative flex-1 min-w-[200px] max-w-md h-[38px]">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="이름, 부서 검색 (엔터키로 동명이인/중복자리 이동)" class="h-full pl-10 pr-8 w-full bg-white border border-stone-300 text-stone-800 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#4F81BD] focus:border-transparent transition-all shadow-sm">
                <button id="clearSearchBtn" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-stone-400 hover:text-stone-600">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="w-px h-6 bg-stone-300 hidden md:block"></div>

            <!-- 화면 배율 조절 -->
            <div class="h-[38px] flex items-center bg-white rounded-lg px-2 border border-stone-300 shadow-sm whitespace-nowrap">
                <button id="zoomOutBtn" title="축소" class="p-1.5 text-stone-500 hover:bg-stone-100 hover:text-stone-800 rounded transition"><i class="fa-solid fa-minus text-xs !text-stone-500"></i></button>
                <span id="zoomVal" class="px-2 text-xs font-bold text-stone-700 min-w-[45px] text-center">100%</span>
                <button id="zoomInBtn" title="확대" class="p-1.5 text-stone-500 hover:bg-stone-100 hover:text-stone-800 rounded transition"><i class="fa-solid fa-plus text-xs !text-stone-500"></i></button>
                <div class="w-px h-3 bg-stone-300 mx-1"></div>
                <button id="zoomResetBtn" title="초기화" class="p-1.5 text-stone-500 hover:bg-stone-100 hover:text-stone-800 rounded transition"><i class="fa-solid fa-rotate-right text-xs !text-stone-500"></i></button>
            </div>

            <!-- 글꼴 크기 조절 -->
            <div class="h-[38px] flex items-center bg-white rounded-lg px-2 border border-stone-300 shadow-sm whitespace-nowrap">
                <span class="text-xs font-bold text-stone-600 pr-1">글자</span>
                <button id="fontDecreaseBtn" title="글씨 축소" class="p-1.5 text-stone-500 hover:bg-stone-100 hover:text-stone-800 rounded transition flex items-center justify-center gap-0.5"><i class="fa-solid fa-font text-[10px] !text-stone-500"></i><i class="fa-solid fa-minus text-[8px] !text-stone-500"></i></button>
                <div class="w-px h-3 bg-stone-300 mx-1"></div>
                <button id="fontResetBtn" title="글씨 초기화" class="p-1.5 text-stone-500 hover:bg-stone-100 hover:text-stone-800 rounded transition flex items-center justify-center"><i class="fa-solid fa-rotate-right text-xs !text-stone-500"></i></button>
                <div class="w-px h-3 bg-stone-300 mx-1"></div>
                <button id="fontIncreaseBtn" title="글씨 확대" class="p-1.5 text-stone-500 hover:bg-stone-100 hover:text-stone-800 rounded transition flex items-center justify-center gap-0.5"><i class="fa-solid fa-font text-[14px] !text-stone-500"></i><i class="fa-solid fa-plus text-[8px] !text-stone-500"></i></button>
            </div>

            <!-- 엑셀 저장 -->
            <button id="downloadExcelBtn" class="h-[38px] ml-auto px-4 bg-[#4F81BD] hover:bg-blue-700 text-white text-sm font-bold rounded-lg transition shadow-sm flex items-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-file-excel !text-white"></i> 저장
            </button>
        </div>

        <div id="dirPanel" class="hidden bg-white border-t border-stone-200 shadow-inner w-full overflow-y-auto" style="max-height: 350px;">
            <div id="dirContent" class="grid grid-cols-1 md:grid-cols-2 gap-8 p-6 max-w-7xl mx-auto w-full"></div>
        </div>
    </div>

    <main class="flex-1 overflow-auto p-4 md:p-10 map-canvas-bg relative grab-mode" id="viewport">
        <!-- 배경색을 원상 복구 (bg-stone-50) -->
        <div id="floorplanContainer" class="bg-stone-50 border border-stone-300 shadow-2xl p-6 md:p-10 rounded-3xl relative transition-transform duration-150 origin-top-left flex flex-col gap-4 mx-auto w-max">
            <div class="flex items-center justify-between pb-4 border-b border-stone-300">
                <div id="tabTitle" class="flex items-center gap-3 text-stone-800 font-black text-sm tracking-wide">
                    <span class="w-3.5 h-3.5 bg-[#4F81BD] rounded-full inline-block"></span>
                    데이터 로딩 중...
                </div>
                <!-- 줌인 안내문구 추가 -->
                <div class="text-xs text-stone-500 font-medium">
                    * 마우스를 드래그(스와이프)하여 지도를 이동하거나, <strong class="text-[#4F81BD]">보고 싶은 위치를 더블클릭하면 줌 인(확대)</strong> 됩니다.
                </div>
            </div>

            <div id="canvasWrapper" class="overflow-auto max-w-full relative">
                <div id="dynamicFloorplan"></div>
            </div>
        </div>
    </main>

    <script>
        // 파일명을 다시 원본으로 롤백 (_2.xlsx 제거, _4.xlsx도 서버에 올리실땐 원본이름으로 변경 권장)
        const offices = {
            'dk17': { name: '현대테라타워 가산DK 17층 (CC사업부)', file: 'dk17.xlsx', data: [] },
            'dk18': { name: '현대테라타워 가산DK 18층 (CC사업부)', file: 'dk18.xlsx', data: [] },
            'daerung': { name: '대륭포스트타워6차 17층 (HQ, CC CTO, CISO)', file: 'daerung.xlsx', data: [] },
            'gplus': { name: '지플러스타워 14층 (플레이오토)', file: 'gplus.xlsx', data: [] },
            'woorim': { name: '우림라이온스밸리 A동 14층 (메이크샵, 몰테일)', file: 'woorim.xlsx', data: [] }
        };
        let currentTab = 'dk17';
        
        // 검색 관리를 위한 글로벌 상태
        let currentSearchQuery = '';
        let globalMatches = [];
        let currentMatchIdx = 0;

        window.searchFromDirectory = function(val) {
            const searchInput = document.getElementById('searchInput');
            searchInput.value = val;
            searchInput.dispatchEvent(new Event('input'));
        };

        document.addEventListener('DOMContentLoaded', () => {
            let zoomLevel = 1.0;

            const viewport = document.getElementById('viewport');
            const floorplan = document.getElementById('floorplanContainer');
            const dynamicFloorplan = document.getElementById('dynamicFloorplan');
            const searchInput = document.getElementById('searchInput');
            const clearSearchBtn = document.getElementById('clearSearchBtn');
            const excelInput = document.getElementById('excelInput');
            const downloadExcelBtn = document.getElementById('downloadExcelBtn');
            const toggleDirBtn = document.getElementById('toggleDirBtn');
            const dirPanel = document.getElementById('dirPanel');
            const adminLoginBtn = document.getElementById('adminLoginBtn');
            const adminControls = document.getElementById('adminControls');
            const changePwBtn = document.getElementById('changePwBtn');
            const printScaleInput = document.getElementById('printScaleInput');

            // --- 탭 전환 로직 ---
            const tabButtons = document.querySelectorAll('.tab-btn');
            tabButtons.forEach(btn => {
                btn.addEventListener('click', (e) => { 
                    if (searchInput.value.trim() !== '') {
                        searchInput.value = '';
                        clearSearchBtn.classList.add('hidden');
                        currentSearchQuery = '';
                        globalMatches = [];
                    }
                    switchTab(e.currentTarget.dataset.tab); 
                });
            });

            function switchTab(tabKey) {
                currentTab = tabKey;
                tabButtons.forEach(btn => {
                    if (btn.dataset.tab === tabKey) {
                        btn.classList.add('bg-[#4F81BD]', 'text-white', 'font-bold', 'shadow-md');
                        btn.classList.remove('text-stone-500', 'hover:text-stone-700', 'hover:bg-stone-200', 'font-medium');
                    } else {
                        btn.classList.remove('bg-[#4F81BD]', 'text-white', 'font-bold', 'shadow-md');
                        btn.classList.add('text-stone-500', 'hover:text-stone-700', 'hover:bg-stone-200', 'font-medium');
                    }
                });
                document.getElementById('tabTitle').innerHTML = `<span class="w-3.5 h-3.5 bg-[#4F81BD] rounded-full inline-block"></span> ${offices[tabKey].name}`;
                renderDatasetToTable(offices[tabKey].data);
            }

            // --- 관리자 설정 ---
            if (!localStorage.getItem('adminPassword_OfficeMap')) {
                localStorage.setItem('adminPassword_OfficeMap', 'cowave8888');
            }

            adminLoginBtn.addEventListener('click', () => {
                if (!adminControls.classList.contains('hidden')) {
                    adminControls.classList.add('hidden');
                    return;
                }
                const currentPw = localStorage.getItem('adminPassword_OfficeMap');
                const inputPw = prompt('관리자 비밀번호를 입력하세요.');
                if (inputPw === currentPw) adminControls.classList.remove('hidden');
                else if (inputPw !== null) alert('비밀번호가 일치하지 않습니다.');
            });

            changePwBtn.addEventListener('click', () => {
                const currentPw = localStorage.getItem('adminPassword_OfficeMap');
                const inputPw = prompt('현재 비밀번호를 입력하세요.');
                if (inputPw === currentPw) {
                    const newPw = prompt('새로운 비밀번호를 입력하세요.');
                    if (newPw) {
                        localStorage.setItem('adminPassword_OfficeMap', newPw);
                        alert('비밀번호가 성공적으로 변경되었습니다.');
                    }
                } else if (inputPw !== null) {
                    alert('현재 비밀번호가 일치하지 않습니다.');
                }
            });

            // --- 줌 컨트롤 ---
            function setZoom(val) {
                zoomLevel = Math.max(0.3, Math.min(2.0, val));
                floorplan.style.transform = `scale(${zoomLevel})`;
                document.getElementById('zoomVal').innerText = `${Math.round(zoomLevel * 100)}%`;
            }

            document.getElementById('zoomInBtn').addEventListener('click', () => setZoom(zoomLevel + 0.1));
            document.getElementById('zoomOutBtn').addEventListener('click', () => setZoom(zoomLevel - 0.1));
            document.getElementById('zoomResetBtn').addEventListener('click', () => setZoom(1.0));

            viewport.addEventListener('wheel', (e) => {
                if (e.ctrlKey) { e.preventDefault(); setZoom(zoomLevel + (e.deltaY < 0 ? 0.08 : -0.08)); }
            }, { passive: false });

            // 더블클릭 줌 인 기능 추가
            viewport.addEventListener('dblclick', (e) => {
                const oldZoom = zoomLevel;
                let targetZoom = Math.min(2.0, zoomLevel + 0.4);
                if (oldZoom === targetZoom) return;

                setZoom(targetZoom);
                
                const rect = viewport.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                const scaleRatio = targetZoom / oldZoom;
                viewport.scrollLeft = (viewport.scrollLeft + mouseX) * scaleRatio - mouseX;
                viewport.scrollTop = (viewport.scrollTop + mouseY) * scaleRatio - mouseY;
            });

            // --- 글씨 크기 조절 ---
            let currentFontSize = 10;
            document.getElementById('fontIncreaseBtn').addEventListener('click', () => {
                if (currentFontSize < 24) { currentFontSize += 1; document.documentElement.style.setProperty('--seat-font-size', currentFontSize + 'px'); }
            });
            document.getElementById('fontDecreaseBtn').addEventListener('click', () => {
                if (currentFontSize > 6) { currentFontSize -= 1; document.documentElement.style.setProperty('--seat-font-size', currentFontSize + 'px'); }
            });
            document.getElementById('fontResetBtn').addEventListener('click', () => {
                currentFontSize = 10; document.documentElement.style.setProperty('--seat-font-size', '10px');
            });

            // --- PC 및 모바일 기기 터치/드래그/핀치줌 지원 ---
            let isDragging = false;
            let startX, startY, scrollLeft, scrollTop;
            let initialPinchDist = null;
            let initialPinchZoom = 1;
            let pinchCenter = {x: 0, y: 0};

            viewport.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                isDragging = true; viewport.classList.add('grabbing-mode');
                startX = e.pageX - viewport.offsetLeft; startY = e.pageY - viewport.offsetTop;
                scrollLeft = viewport.scrollLeft; scrollTop = viewport.scrollTop;
            });
            viewport.addEventListener('mouseleave', () => { isDragging = false; viewport.classList.remove('grabbing-mode'); });
            viewport.addEventListener('mouseup', () => { isDragging = false; viewport.classList.remove('grabbing-mode'); });
            viewport.addEventListener('mousemove', (e) => {
                if (!isDragging) return; e.preventDefault();
                const x = e.pageX - viewport.offsetLeft; const y = e.pageY - viewport.offsetTop;
                const walkX = (x - startX) * 1.5; const walkY = (y - startY) * 1.5;
                viewport.scrollLeft = scrollLeft - walkX; viewport.scrollTop = scrollTop - walkY;
            });

            // 모바일 멀티 터치 (핀치 줌 및 패닝)
            viewport.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    isDragging = false;
                    initialPinchDist = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    initialPinchZoom = zoomLevel;
                    const rect = viewport.getBoundingClientRect();
                    pinchCenter = {
                        x: ((e.touches[0].pageX + e.touches[1].pageX) / 2) - rect.left,
                        y: ((e.touches[0].pageY + e.touches[1].pageY) / 2) - rect.top
                    };
                } else if (e.touches.length === 1) {
                    isDragging = true;
                    viewport.classList.add('grabbing-mode');
                    startX = e.touches[0].pageX - viewport.offsetLeft;
                    startY = e.touches[0].pageY - viewport.offsetTop;
                    scrollLeft = viewport.scrollLeft;
                    scrollTop = viewport.scrollTop;
                }
            }, { passive: false });
            
            viewport.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && initialPinchDist) {
                    e.preventDefault(); // 브라우저 고유 스크롤/줌 방지
                    const currentDist = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    const scale = currentDist / initialPinchDist;
                    
                    const oldZoom = zoomLevel;
                    let newZoom = Math.max(0.3, Math.min(2.0, initialPinchZoom * scale));
                    setZoom(newZoom);
                    
                    if(oldZoom !== newZoom) {
                        const scaleRatio = newZoom / oldZoom;
                        viewport.scrollLeft = (viewport.scrollLeft + pinchCenter.x) * scaleRatio - pinchCenter.x;
                        viewport.scrollTop = (viewport.scrollTop + pinchCenter.y) * scaleRatio - pinchCenter.y;
                    }
                } else if (e.touches.length === 1 && isDragging) {
                    e.preventDefault();
                    const x = e.touches[0].pageX - viewport.offsetLeft;
                    const y = e.touches[0].pageY - viewport.offsetTop;
                    const walkX = (x - startX) * 1.5;
                    const walkY = (y - startY) * 1.5;
                    viewport.scrollLeft = scrollLeft - walkX;
                    viewport.scrollTop = scrollTop - walkY;
                }
            }, { passive: false });

            viewport.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) {
                    initialPinchDist = null;
                }
                if (e.touches.length === 0) {
                    isDragging = false;
                    viewport.classList.remove('grabbing-mode');
                } else if (e.touches.length === 1) {
                    // 남은 한 손가락으로 드래그 재설정
                    startX = e.touches[0].pageX - viewport.offsetLeft;

            // --- 데이터 렌더링 및 디렉토리 추출 로직 ---
            function updateDirectory(items) {
                const teams = new Set(); const rooms = new Set();

                    if (!it.v) return; const val = it.v.trim();
                    if (val === '' || val.includes('출입문') || val === '(예비 공석)' || val.includes('외부인력') || val.includes('망분리 PC') || val.includes('택배PC') || val.includes('우편') || val.includes('공용창고') || val.includes('STORAGE')) return;

                    // 회의실 분류 (임원실/CEO 제외, 1인회의실, OA존 포함)
                    // OA 또는 OA존 키워드 추가
                    const isRoom = val.includes('화장실') || val.includes('회의') || val.includes('포커스') || vUp.includes('CONFERENCE') || vUp.includes('A80') || vUp.includes('A1201') || vUp.includes('B80') || vUp.includes('B1201') || val.includes('라운지') || vUp.includes('LOUNGE') || vUp.includes('서버실') || vUp.includes('SERVER') || vUp.includes('TEST') || val.includes('ROOM') || vUp.includes('OA') || val.includes('탕비') || val.includes('메일룸');
                    
                    // 팀 및 부서 분류 (임원실/CEO 포함, 1407호 포함, 지플러스 셀/그룹/담당/본부/실/부 등 포함)
                    // OA존은 회의실로 가야하므로 isTitle에서 OA 제외
                    const isTitle = (!vUp.includes('OA') && !val.includes('회의') && !val.includes('화장실') && !val.includes('서버') && !val.includes('탕비') && (val.includes('임원') || vUp.includes('CEO') || val.includes('부서') || val.includes('팀') || val.includes('본부') || val.includes('실') || val.includes('파트') || val.includes('사업') || val.includes('셀') || val.includes('그룹') || val.includes('담당') || val.includes('센터') || vUp.includes('WORK STATION') || val.includes('구역') || val.includes('존') || vUp.includes('ZONE'))) && !val.includes('전산파트');
                    
                    const cleanVal = val.replace(/\n/g, ' ').trim();
                    if (isTitle) teams.add(cleanVal); else if (isRoom && !isTitle) rooms.add(cleanVal); 
                });

                const buildSection = (title, icon, set) => {

                    arr.forEach(item => { html += `<button onclick="searchFromDirectory('${item}')" class="px-2.5 py-1.5 bg-white border border-stone-300 hover:border-[#4F81BD] hover:text-[#4F81BD] hover:bg-blue-50 rounded-md text-xs font-bold text-stone-600 transition shadow-sm">${item}</button>`; });
                    html += `</div></div>`; return html;

                document.getElementById('dirContent').innerHTML = buildSection('부서 및 팀', 'fa-solid fa-users-viewfinder', teams) + buildSection('회의실 및 시설', 'fa-solid fa-door-closed', rooms);
            }

                            const isHorizontalForce = valTrimmed.includes('임원') || vUp.includes('CEO') || valTrimmed.includes('부서') || valTrimmed.includes('팀') || valTrimmed.includes('본부') || valTrimmed.includes('실') || valTrimmed.includes('센터') || valTrimmed.includes('셀') || valTrimmed.includes('그룹') || valTrimmed.includes('담당') || vUp.includes('ZONE') || valTrimmed.includes('파트') || valTrimmed.includes('라운지') || valTrimmed.includes('공용창고') || valTrimmed.includes('회의');

                            if (isHorizontalForce) {

                                wrapperDiv.innerHTML = `<span>${valTrimmed.replace(/\n/g, ' ')}</span>`;
                            } else {
                                const isVertical = (item.align && (item.align.textRotation === '255' || item.align.textRotation === '90')) || (item.rs > item.cs && valTrimmed.length >= 2 && !valTrimmed.includes('출입문') && !vUp.includes('PC')) || valTrimmed.includes('김성실');
                                
                                if (isVertical && valTrimmed.length > 0) {
                                    const parts = valTrimmed.split('\n');
                                    let htmlContent = '';
                                    if (parts.length > 0) htmlContent += `<div style="writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 1px;">${parts[0]}</div>`;
                                    if (parts.length > 1) htmlContent += `<div style="margin-top: 4px; font-weight: 900; font-size: 0.95em;">${parts.slice(1).join(' ')}</div>`;
                                    wrapperDiv.innerHTML = htmlContent;
                                } else {
                                    wrapperDiv.innerHTML = valTrimmed.replace(/\n/g, '<br>');
                                }
                            }
                            
                            td.appendChild(wrapperDiv);
                            
                            if (valTrimmed !== '' && !isHorizontalForce && !valTrimmed.includes('화장실') && !valTrimmed.includes('서버룸')) {
                                td.classList.add('seat-td');
                            }
                            
                            td.style.backgroundColor = item.bg || 'transparent';
                            td.style.border = 'none';

                            let currentBorder = item.border || {};
                            if (Object.keys(currentBorder).length > 0) {
                                ['top', 'bottom', 'left', 'right'].forEach(side => {
                                    if (currentBorder[side]) {
                                        const b = currentBorder[side];
                                        let cssStyle = 'solid';
                                        if (b.style.toLowerCase().includes('dash')) cssStyle = 'dashed';
                                        if (b.style.toLowerCase().includes('dot')) cssStyle = 'dotted';
                                        if (b.style.toLowerCase() === 'none') cssStyle = 'none';
                                        
                                        let cssColor = '#000000';
                                        if (b.color) cssColor = '#' + (b.color.length === 8 ? b.color.substring(2) : b.color);
                                        
                                        let cssWidth = '1px'; 
                                        if (b.style.toLowerCase() === 'medium') cssWidth = '2px';
                                        if (b.style.toLowerCase() === 'thick') cssWidth = '3px';
                                        if (b.style.toLowerCase() === 'double') { cssStyle = 'double'; cssWidth = '3px'; }
                                        
                                        if (cssStyle !== 'none') td.style.setProperty(`border-${side}`, `${cssWidth} ${cssStyle} ${cssColor}`, 'important');
                                    }
                                });

                            td.style.wordBreak = 'break-all';

                                    const gv = parseInt(hex.substr(2, 2), 16);
                                    const bv = parseInt(hex.substr(4, 2), 16);
                                    const yiq = ((rv * 299) + (gv * 587) + (bv * 114)) / 1000;
                                    if (yiq < 128) td.style.color = '#ffffff';

            // --- 엑셀 파싱 로직 ---
            function applyTint(hex, tint) {
                if (!hex) return hex;
                hex = hex.replace('#', '');
                if (hex.length === 8) hex = hex.substring(2); 
                let r = parseInt(hex.substring(0, 2), 16);
                let g = parseInt(hex.substring(2, 4), 16);
                let b = parseInt(hex.substring(4, 6), 16);

                if (tint > 0) {
                    r = Math.round(r * (1 - tint) + (255 * tint));
                    g = Math.round(g * (1 - tint) + (255 * tint));
                    b = Math.round(b * (1 - tint) + (255 * tint));
                } else if (tint < 0) {
                    r = Math.round(r * (1 + tint));
                    g = Math.round(g * (1 + tint));
                    b = Math.round(b * (1 + tint));
                }
                const toHex = (n) => { const h = Math.max(0, Math.min(255, n)).toString(16); return h.length === 1 ? '0' + h : h; };
                return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
            }

            async function parseXlsxDirectXML(fileArrayBuffer) {
                const zip = await JSZip.loadAsync(fileArrayBuffer);
                const stylesXmlText = await zip.file('xl/styles.xml').async('string');
                const parser = new DOMParser();
                const stylesDoc = parser.parseFromString(stylesXmlText, 'text/xml');

                const themeColors = {
                    0: "#FFFFFF", 1: "#000000", 2: "#E7E6E6", 3: "#44546A",
                    4: "#5B9BD5", 5: "#ED7D31", 6: "#A5A5A5", 7: "#FFC000",
                    8: "#4472C4", 9: "#70AD47", 10: "#FFFF00", 11: "#FF0000"
                };

                const fills = [];
                stylesDoc.querySelectorAll('fills > fill').forEach(f => {
                    const fg = f.querySelector('fgColor');
                    if (fg) {
                        const rgb = fg.getAttribute('rgb'); const theme = fg.getAttribute('theme'); const tint = parseFloat(fg.getAttribute('tint') || '0');
                        let baseColor = "";
                        if (rgb) baseColor = "#" + (rgb.length === 8 ? rgb.substring(2) : rgb);
                        else if (theme !== null) baseColor = themeColors[theme] || "#E2E8F0";
                        if (baseColor && tint !== 0) baseColor = applyTint(baseColor, tint);
                        fills.push(baseColor);
                    } else fills.push("");
                });

                const borders = [];
                stylesDoc.querySelectorAll('borders > border').forEach(b => {
                    const borderObj = {};
                    ['top', 'bottom', 'left', 'right'].forEach(side => {
                        const sideNode = b.querySelector(side);
                        if (sideNode && sideNode.getAttribute('style')) {
                            const colorNode = sideNode.querySelector('color');
                            let color = "FF000000";
                            if (colorNode) {
                                const rgb = colorNode.getAttribute('rgb'); const theme = colorNode.getAttribute('theme'); const tint = parseFloat(colorNode.getAttribute('tint') || '0');
                                if (rgb) color = rgb;
                                else if (theme !== null) {
                                    let baseC = themeColors[theme] || "#000000";
                                    if (tint !== 0) baseC = applyTint(baseC, tint);
                                    color = "FF" + baseC.replace('#', '');
                                }
                            }
                            borderObj[side] = { style: sideNode.getAttribute('style'), color: color };
                        }
                    });
                    borders.push(borderObj);
                });

                const xfFills = []; const xfBorders = []; const xfAligns = [];
                stylesDoc.querySelectorAll('cellXfs > xf').forEach(xf => {
                    const fillId = parseInt(xf.getAttribute('fillId') || '0', 10);
                    const borderId = parseInt(xf.getAttribute('borderId') || '0', 10);
                    xfFills.push(fills[fillId] || ""); xfBorders.push(borders[borderId] || {});
                    
                    const aNode = xf.querySelector('alignment');
                    if (aNode) xfAligns.push({ wrapText: aNode.getAttribute('wrapText'), textRotation: aNode.getAttribute('textRotation') });
                    else xfAligns.push({});
                });

                const sheetXmlText = await zip.file('xl/worksheets/sheet1.xml').async('string');
                const sheetDoc = parser.parseFromString(sheetXmlText, 'text/xml');

                let sharedStrings = [];
                const ssFile = zip.file('xl/sharedStrings.xml');
                if (ssFile) {
                    const ssXmlText = await ssFile.async('string');
                    const ssDoc = parser.parseFromString(ssXmlText, 'text/xml');
                    ssDoc.querySelectorAll('si').forEach(si => sharedStrings.push(si.textContent.trim()));
                }

                const mergeMap = {};
                sheetDoc.querySelectorAll('mergeCells > mergeCell').forEach(m => {
                    const ref = m.getAttribute('ref'); const parts = ref.split(':');
                    const start = XLSX.utils.decode_cell(parts[0]); const end = XLSX.utils.decode_cell(parts[1]);
                    mergeMap[`${start.r + 1},${start.c + 1}`] = { rs: end.r - start.r + 1, cs: end.c - start.c + 1, endR: end.r + 1, endC: end.c + 1 };
                });

                const rawCells = {};
                sheetDoc.querySelectorAll('sheetData > row > c').forEach(c => {
                    const cellAddr = c.getAttribute('r'); const decoded = XLSX.utils.decode_cell(cellAddr);
                    const row = decoded.r + 1; const col = decoded.c + 1;
                    const styleIdx = parseInt(c.getAttribute('s') || '0', 10);
                    const bg = xfFills[styleIdx] || ""; const border = xfBorders[styleIdx] || {}; const align = xfAligns[styleIdx] || {};
                    const type = c.getAttribute('t'); const vNode = c.querySelector('v');
                    let val = "";
                    if (vNode) {
                        if (type === 's') val = sharedStrings[parseInt(vNode.textContent, 10)] || "";
                        else val = vNode.textContent;
                    } else {
                        const isNode = c.querySelector('is > t');
                        if (isNode) val = isNode.textContent;
                    }
                    rawCells[`${row},${col}`] = { r: row, c: col, v: val, bg: bg, border: border, align: align };
                });

                const parsedItems = [];
                Object.keys(rawCells).forEach(key => {
                    const cell = rawCells[key];
                    const span = mergeMap[`${cell.r},${cell.c}`] || { rs: 1, cs: 1 };
                    let mergedBorder = JSON.parse(JSON.stringify(cell.border));

                    if (span.rs > 1 || span.cs > 1) {
                        const endR = cell.r + span.rs - 1; const endC = cell.c + span.cs - 1;
                        const bottomCell = rawCells[`${endR},${cell.c}`];
                        if (bottomCell && bottomCell.border && bottomCell.border.bottom) mergedBorder.bottom = bottomCell.border.bottom;
                        const rightCell = rawCells[`${cell.r},${endC}`];
                        if (rightCell && rightCell.border && rightCell.border.right) mergedBorder.right = rightCell.border.right;
                        const cornerCell = rawCells[`${endR},${endC}`];
                        if (cornerCell && cornerCell.border) {
                            if (cornerCell.border.bottom) mergedBorder.bottom = cornerCell.border.bottom;
                            if (cornerCell.border.right) mergedBorder.right = cornerCell.border.right;
                        }
                    }

                    if (cell.v || cell.bg || span.rs > 1 || span.cs > 1 || Object.keys(mergedBorder).length > 0) {
                        parsedItems.push({ r: cell.r, c: cell.c, v: cell.v, bg: cell.bg, rs: span.rs, cs: span.cs, border: mergedBorder, align: cell.align, isExcel: true });
                    }
                });

                return parsedItems;
            }

            downloadExcelBtn.addEventListener('click', () => {
                const activeData = offices[currentTab].data;
                if (!activeData || activeData.length === 0) return alert("다운로드할 데이터가 없습니다.");

                const wb = XLSX.utils.book_new();
                const ws = {}; const merges = [];

                let maxR = 75, maxC = 100;
                activeData.forEach(item => {
                    if (item.r + item.rs > maxR) maxR = item.r + item.rs;
                    if (item.c + item.cs > maxC) maxC = item.c + item.cs;
                });

                activeData.forEach(item => {
                    const r = item.r - 1; const c = item.c - 1;
                    if (item.rs > 1 || item.cs > 1) {
                        merges.push({ s: { r: r, c: c }, e: { r: r + item.rs - 1, c: c + item.cs - 1 } });
                    }
                });

                activeData.forEach(item => {
                    const startR = item.r - 1; const startC = item.c - 1;
                    const endR = startR + item.rs - 1; const endC = startC + item.cs - 1;

                    for (let currR = startR; currR <= endR; currR++) {
                        for (let currC = startC; currC <= endC; currC++) {
                            const cellRef = XLSX.utils.encode_cell({r: currR, c: currC});
                            let cellStyle = {
                                font: { name: "맑은 고딕", sz: 10, bold: true, color: { rgb: "33302A" } },
                                alignment: { vertical: "center", horizontal: "center", wrapText: true }
                            };

                            let textValue = "";
                            if (currR === startR && currC === startC) {
                                textValue = item.v || "";
                                if (item.align && (item.align.textRotation === '255' || item.align.textRotation === '90')) {
                                    cellStyle.alignment.textRotation = 255;
                                }
                            }

                            if (item.bg && item.bg.trim() !== "") {
                                cellStyle.fill = { fgColor: { rgb: item.bg.replace("#", "") } };
                                const hex = item.bg.replace('#', '');
                                if (hex.length === 6) {
                                    const rv = parseInt(hex.substr(0, 2), 16); const gv = parseInt(hex.substr(2, 2), 16); const bv = parseInt(hex.substr(4, 2), 16);
                                    if (((rv * 299) + (gv * 587) + (bv * 114)) / 1000 < 128) cellStyle.font.color = { rgb: "FFFFFF" };
                                }
                            }

                            if (item.border && Object.keys(item.border).length > 0) {
                                cellStyle.border = {};
                                if (currR === startR && item.border.top) cellStyle.border.top = { style: item.border.top.style, color: { rgb: item.border.top.color.replace(/^FF/, '').replace(/^#/, '') || "000000" } };
                                if (currR === endR && item.border.bottom) cellStyle.border.bottom = { style: item.border.bottom.style, color: { rgb: item.border.bottom.color.replace(/^FF/, '').replace(/^#/, '') || "000000" } };
                                if (currC === startC && item.border.left) cellStyle.border.left = { style: item.border.left.style, color: { rgb: item.border.left.color.replace(/^FF/, '').replace(/^#/, '') || "000000" } };
                                if (currC === endC && item.border.right) cellStyle.border.right = { style: item.border.right.style, color: { rgb: item.border.right.color.replace(/^FF/, '').replace(/^#/, '') || "000000" } };
                            }
                            if (!ws[cellRef]) ws[cellRef] = { v: textValue, t: "s", s: cellStyle };
                            else { ws[cellRef].v = textValue; ws[cellRef].s = cellStyle; }
                        }
                    }
                });

                ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: maxR - 1, c: maxC - 1 } });
                ws['!merges'] = merges; ws['!cols'] = Array(maxC).fill({ wpx: 32 }); ws['!rows'] = Array(maxR).fill({ hpx: 26 }); 
                XLSX.utils.book_append_sheet(wb, ws, offices[currentTab].name);
                XLSX.writeFile(wb, `${offices[currentTab].name}.xlsx`);
            });

            // --- 고도화된 통합 검색 로직 (엔터키 순환 이동 & 포커싱 지원) ---
            function performSearch() {
                const query = searchInput.value.replace(/\s+/g, '').toLowerCase();
                clearSearchBtn.classList.toggle('hidden', query.length === 0);

                if (query !== currentSearchQuery) {
                    currentSearchQuery = query;
                    globalMatches = [];
                    currentMatchIdx = 0;
                    
                    // 기존 하이라이트 효과 모두 제거
                    document.querySelectorAll('.excel-table-layout td').forEach(td => {
                        td.classList.remove('highlight-seat', 'active-match');
                    });

                    if (query.length > 0) {
                        for (const tabKey of Object.keys(offices)) {
                            const data = offices[tabKey].data;
                            if (data) {
                                data.forEach(item => {
                                    const text = (item.v || '').replace(/\s+/g, '').toLowerCase();
                                    if (text.includes(query)) {
                                        globalMatches.push({ tab: tabKey, item: item });
                                    }
                                });
                            }
                        }
                    }
                    
                    if (globalMatches.length > 0) {
                        goToMatch(globalMatches[0]);
                    }
                }
            }

            // 특정 매칭 타겟으로 이동 및 하이라이트 처리 함수
            function goToMatch(matchObj) {
                if (currentTab !== matchObj.tab) {
                    switchTab(matchObj.tab); 
                }
                
                // switchTab 이후에 화면에 요소가 다시 렌더링되므로, 현재 탭의 일치 항목들에 클래스 재부여
                const query = currentSearchQuery;
                document.querySelectorAll('.excel-table-layout td').forEach(td => {
                    const text = td.innerText.replace(/\s+/g, '').toLowerCase();
                    if (query && text && text.includes(query)) {
                        td.classList.add('highlight-seat');
                    } else {
                        td.classList.remove('highlight-seat');
                    }
                });

                // 타겟 좌석 찾기
                const targetTd = document.querySelector(`.excel-table-layout td[data-r="${matchObj.item.r}"][data-c="${matchObj.item.c}"]`);
                
                if (targetTd) {
                    // 이전 active-match 포커스 제거 후 타겟에 부여 (주황색 강한 하이라이트)
                    document.querySelectorAll('.excel-table-layout td.active-match').forEach(td => td.classList.remove('active-match'));
                    targetTd.classList.add('active-match');

                    // 스크롤 중앙 정렬
                    const viewportRect = viewport.getBoundingClientRect();
                    const elementRect = targetTd.getBoundingClientRect();
                    
                    const currentScrollTop = viewport.scrollTop;
                    const currentScrollLeft = viewport.scrollLeft;
                    const targetTop = currentScrollTop + (elementRect.top - viewportRect.top) - (viewportRect.height / 2) + (elementRect.height / 2);
                    const targetLeft = currentScrollLeft + (elementRect.left - viewportRect.left) - (viewportRect.width / 2) + (elementRect.width / 2);

                    viewport.scrollTo({ top: targetTop, left: targetLeft, behavior: 'smooth' });
                }
            }

            // 키보드 엔터키를 통한 동명이인/다중좌석 이동 기능 (핵심)
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (globalMatches.length > 1) {
                        currentMatchIdx = (currentMatchIdx + 1) % globalMatches.length;
                        goToMatch(globalMatches[currentMatchIdx]);
                    } else if (globalMatches.length === 1) {
                        goToMatch(globalMatches[0]);
                    }
                }
            });

            searchInput.addEventListener('input', performSearch);
            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                performSearch();
            });

            // --- 엑셀 파일 초기 로드 ---
            async function loadAllSharedExcels() {
                for (const key of Object.keys(offices)) {
                    try {
                        const response = await fetch(offices[key].file);
                        if (response.ok) {
                            const arrayBuffer = await response.arrayBuffer();
                            const parsedItems = await parseXlsxDirectXML(arrayBuffer);
                            if (parsedItems && parsedItems.length > 0) {
                                offices[key].data = parsedItems;
                                localStorage.setItem('savedFloorplanData_' + key, JSON.stringify(parsedItems));
                                continue;
                            }
                        }
                    } catch (err) {
                        console.warn(`[${key}] 서버 엑셀 로드 실패, 로컬 스토리지 데이터로 대체 시도.`);
                    }
                    
                    const savedData = localStorage.getItem('savedFloorplanData_' + key);
                    if (savedData) {
                        offices[key].data = JSON.parse(savedData);
                    }
                }
                
                switchTab(currentTab);
            }
            
            loadAllSharedExcels();
        });
    </script>
</body>
</html>
