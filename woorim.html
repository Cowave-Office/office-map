<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커넥트웨이브 통합 공간배치도 통합 좌석 및 시설 안내</title>
    <meta name="robots" content="noindex, nofollow">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

    <script>
        // ReferenceError 방지를 위한 안전한 초기화 (CDN 로드 지연 시 대비)
        window.tailwind = window.tailwind || {};
        window.tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Noto Sans KR', 'sans-serif'] },
                    colors: { themeBlue: '#4F81BD' }
                }
            }
        };
    </script>

    <style>
        :root { 
            --print-scale: 0.6; 
            --seat-font-size: 10px; /* 글자 크기 변수화 */
        }
        
        body { -webkit-font-smoothing: antialiased; touch-action: none; /* 모바일 브라우저 기본 제스처 방지 */ }
        .fa-solid { color: #4F81BD !important; }
        
        .header-icon { color: #4F81BD !important; }
        .text-stone-400 .fa-solid { color: #a8a29e !important; }
        .text-stone-500.fa-solid { color: #78716c !important; }
        .text-white .fa-solid, .fa-print, .fa-key, .fa-file-import, .fa-file-excel { color: inherit !important; }

        .map-canvas-bg {
            background-color: #e5e2d8;
            background-image: radial-gradient(#cbc6b7 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        .grab-mode { cursor: grab; }
        .grabbing-mode { cursor: grabbing !important; }

        .excel-table-layout {
            border-collapse: collapse; 
            table-layout: fixed;
            margin: 0 auto;
        }

        .excel-table-layout td {
            height: 26px; padding: 0; margin: 0; 
            font-size: var(--seat-font-size); 
            font-weight: 700; text-align: center; vertical-align: middle; 
            color: #33302a; white-space: pre-wrap; word-break: keep-all; 
            line-height: 1.15; user-select: none; box-sizing: border-box; position: relative;
        }

        .seat-td { transition: all 0.15s ease-in-out; }
        .seat-td:hover {
            transform: translateY(-2px) scale(1.12);
            box-shadow: 0 8px 18px rgba(0,0,0,0.18);
            z-index: 50; position: relative;
            outline: 2.5px solid #4F81BD !important;
            border-color: transparent !important;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); outline: 0px solid rgba(79, 129, 189, 0.7); }
            50% { transform: scale(1.18); outline: 6px solid rgba(79, 129, 189, 0); }
            100% { transform: scale(1); outline: 0px solid rgba(79, 129, 189, 0); }
        }
        
        /* 일반 검색 결과 하이라이트 */
        .highlight-seat {
            animation: pulse-glow 1.2s infinite; z-index: 40 !important;
            border: 2px solid #4F81BD !important; background-color: #4F81BD !important;
            color: #ffffff !important; font-weight: 900 !important;
        }
        
        /* 엔터키로 포커스된 현재 타겟 좌석 하이라이트 (주황색) */
        .active-match {
            outline: 3px solid #f59e0b !important;
            background-color: #f59e0b !important;
            color: #ffffff !important;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
            z-index: 60 !important;
            transform: translateY(-2px) scale(1.15);
            animation: none !important;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #e5e2d8; }
        ::-webkit-scrollbar-thumb { background: #c5c0b2; }
        ::-webkit-scrollbar-thumb:hover { background: #a39e90; }

        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            header, #secondaryToolbar { display: none !important; }
            body, html, main#viewport { height: auto !important; overflow: visible !important; background: white !important; position: static !important; padding: 0 !important; }
            #floorplanContainer { transform: scale(var(--print-scale)) !important; transform-origin: top left !important; box-shadow: none !important; border: none !important; margin: 0 !important; padding: 0 !important; }
        }
    </style>
<link rel="stylesheet" href="map.css">
</head>
<body data-office="woorim" data-design="original" class="bg-stone-100 text-stone-800 h-screen flex flex-col overflow-hidden font-sans antialiased">

    <header class="bg-white border-b border-stone-200 px-6 py-3 flex flex-wrap items-center justify-between shadow-sm z-30 shrink-0">
        
        <div class="flex items-center gap-3.5 mb-2 md:mb-0">
            <div id="adminLoginBtn" class="p-2 bg-white text-[#4F81BD] rounded-xl shadow-sm border border-stone-200 cursor-pointer hover:bg-stone-50 transition" title="관리자 모드">
                <i class="fa-solid fa-building text-xl header-icon"></i>
            </div>
            <div>
                <h1 class="text-xl font-extrabold tracking-tight flex items-center gap-2.5 text-stone-800">
                    커넥트웨이브 통합 공간배치도<span class="header-subtitle">통합 좌석 및 시설 안내</span>
                </h1>
                <p class="text-xs text-stone-500 flex items-center gap-1"><i class="fa-solid fa-lock text-stone-400 text-[10px]"></i> 사내 전용 보안 문서입니다.</p>
            </div>
        </div>

        <nav class="flex flex-wrap items-center gap-1.5 bg-stone-100 p-1.5 rounded-xl border border-stone-200 shadow-inner w-full md:w-auto overflow-x-auto">
            <button class="tab-btn bg-[#4F81BD] text-white font-bold shadow-md px-3.5 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1.5 whitespace-nowrap" data-tab="daerung">
                대륭(HQ, CC CTO, CISO)
            </button>
            <button class="tab-btn text-stone-500 hover:text-stone-700 hover:bg-stone-200 font-medium px-3.5 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1.5 whitespace-nowrap" data-tab="woorim">
                우림(메이크샵, 몰테일)
            </button>
            <button class="tab-btn text-stone-500 hover:text-stone-700 hover:bg-stone-200 font-medium px-3.5 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1.5 whitespace-nowrap" data-tab="dk18">
                가산DK 18F(CC사업부)
            </button>
            <button class="tab-btn text-stone-500 hover:text-stone-700 hover:bg-stone-200 font-medium px-3.5 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1.5 whitespace-nowrap" data-tab="dk17">
                가산DK 17F(CC사업부)
            </button>
            <button class="tab-btn text-stone-500 hover:text-stone-700 hover:bg-stone-200 font-medium px-3.5 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1.5 whitespace-nowrap" data-tab="gplus">
                지플러스(플레이오토)
            </button>
        </nav>

        <div class="flex items-center gap-2 mt-2 md:mt-0">
            <!-- 기본적으로 숨겨져 있으며, 관리자 로그인 시 나타납니다. -->
            <div id="adminControls" class="hidden flex items-center gap-2">
                <div class="flex items-center gap-1.5 bg-white border border-stone-300 px-2.5 py-1.5 rounded-lg shadow-sm">
                    <label for="printScaleInput" class="text-xs text-stone-600 font-bold cursor-pointer"><i class="fa-solid fa-down-left-and-up-right-to-center header-icon"></i> 인쇄 비율</label>
                    <div class="flex items-center bg-stone-100 border border-stone-300 rounded px-1.5 py-0.5">
                        <input type="number" id="printScaleInput" value="60" min="10" max="150" step="5" class="bg-transparent text-stone-800 text-xs w-9 text-right focus:outline-none font-bold">
                        <span class="text-stone-500 text-xs ml-0.5 font-bold">%</span>
                    </div>
                </div>

                <button onclick="window.print()" class="px-3.5 py-1.5 bg-white hover:bg-stone-50 text-stone-700 border border-[#4F81BD] text-xs font-bold rounded-lg transition shadow-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-print !text-[#4F81BD]"></i> 인쇄
                </button>

                <div class="w-px h-5 bg-stone-300 mx-1 hidden sm:block"></div>

                <button id="changePwBtn" class="px-3 py-1.5 bg-stone-800 hover:bg-stone-700 text-stone-200 text-xs font-bold rounded-lg transition shadow-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-key !text-stone-300"></i> PW 변경
                </button>
                <label for="excelInput" class="px-3 py-1.5 bg-stone-800 hover:bg-stone-700 text-stone-200 text-xs font-bold rounded-lg transition shadow-sm flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-file-import !text-stone-300"></i> 업로드
                </label>
                <input type="file" id="excelInput" accept=".xlsx, .xls, .csv" class="hidden" />
            </div>
        </div>
    </header>

    <div id="secondaryToolbar" class="bg-stone-50 shadow-sm z-20 relative flex flex-col border-b border-stone-200">
        <div class="py-2.5 px-4 md:px-6 flex flex-wrap items-center gap-3 md:gap-4">
            
            <button id="toggleDirBtn" aria-expanded="false" aria-controls="dirPanel" class="h-[38px] px-4 bg-white hover:bg-stone-100 text-[#4F81BD] border border-[#4F81BD] rounded-lg text-sm font-bold transition flex items-center gap-2 shadow-sm whitespace-nowrap">
                <i class="fa-solid fa-list"></i> 전체 리스트
            </button>
            
            <div class="w-px h-6 bg-stone-300 hidden md:block"></div>
            
            <!-- 전 지점 통합 검색창 -->
            <div id="searchBox" class="relative flex-1 min-w-[200px] max-w-md h-[38px]">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400 text-sm"></i>
                <input type="text" id="searchInput" role="combobox" aria-label="이름 또는 부서 검색" aria-autocomplete="list" aria-expanded="false" aria-controls="searchResults" autocomplete="off" enterkeyhint="search" placeholder="이름 또는 부서 검색" class="h-full pl-10 pr-8 w-full bg-white border border-stone-300 text-stone-800 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#4F81BD] focus:border-transparent transition-all shadow-sm">
                <button id="clearSearchBtn" title="검색 지우기" aria-label="검색 지우기" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-stone-400 hover:text-stone-600">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="w-px h-6 bg-stone-300 hidden md:block"></div>

            <div id="searchPopup" hidden><div id="searchSummary" role="status" aria-live="polite"></div><div id="searchResults" role="listbox" aria-label="검색 결과"></div></div>
            <!-- 화면 배율 조절 -->
            <div class="h-[38px] flex items-center bg-white rounded-lg px-2 border border-stone-300 shadow-sm whitespace-nowrap">
                <button id="zoomOutBtn" title="축소" class="p-1.5 text-stone-500 hover:bg-stone-100 hover:text-stone-800 rounded transition"><i class="fa-solid fa-minus text-xs !text-stone-500"></i></button>
                <span id="zoomVal" aria-live="polite" class="px-2 text-xs font-bold text-stone-700 min-w-[45px] text-center">100%</span>
                <button id="zoomInBtn" title="확대" class="p-1.5 text-stone-500 hover:bg-stone-100 hover:text-stone-800 rounded transition"><i class="fa-solid fa-plus text-xs !text-stone-500"></i></button>
                <div class="w-px h-3 bg-stone-300 mx-1"></div>
                <button id="zoomResetBtn" title="지도 전체 보기" aria-label="지도 전체 보기" class="p-1.5 text-stone-500 hover:bg-stone-100 hover:text-stone-800 rounded transition"><i class="fa-solid fa-rotate-right text-xs !text-stone-500"></i></button>
            </div>

            <button id="fullscreenBtn" type="button" title="전체화면" aria-label="전체화면" aria-pressed="false"><i class="fa-solid fa-expand" aria-hidden="true"></i></button>
            <!-- 글꼴 크기 조절 -->
            <div class="h-[38px] flex items-center bg-white rounded-lg px-2 border border-stone-300 shadow-sm whitespace-nowrap">
                <span class="text-xs font-bold text-stone-600 pr-1">글자</span>
                <button id="fontDecreaseBtn" title="글씨 축소" class="p-1.5 text-stone-500 hover:bg-stone-100 hover:text-stone-800 rounded transition flex items-center justify-center gap-0.5"><i class="fa-solid fa-font text-[10px] !text-stone-500"></i><i class="fa-solid fa-minus text-[8px] !text-stone-500"></i></button>
                <div class="w-px h-3 bg-stone-300 mx-1"></div>
                <button id="fontResetBtn" title="글씨 초기화" class="p-1.5 text-stone-500 hover:bg-stone-100 hover:text-stone-800 rounded transition flex items-center justify-center"><i class="fa-solid fa-rotate-right text-xs !text-stone-500"></i></button>
                <div class="w-px h-3 bg-stone-300 mx-1"></div>
                <button id="fontIncreaseBtn" title="글씨 확대" class="p-1.5 text-stone-500 hover:bg-stone-100 hover:text-stone-800 rounded transition flex items-center justify-center gap-0.5"><i class="fa-solid fa-font text-[14px] !text-stone-500"></i><i class="fa-solid fa-plus text-[8px] !text-stone-500"></i></button>
            </div>

            <!-- 엑셀 저장 -->
            <button id="downloadExcelBtn" title="엑셀 저장" aria-label="엑셀 저장" class="h-[38px] ml-auto px-4 bg-[#4F81BD] hover:bg-blue-700 text-white text-sm font-bold rounded-lg transition shadow-sm flex items-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-file-excel !text-white"></i> 저장
            </button>
        </div>

        <div id="dirPanel" class="hidden bg-white border-t border-stone-200 shadow-inner w-full overflow-y-auto" style="max-height: 350px;">
            <div id="dirContent" class="grid grid-cols-1 md:grid-cols-2 gap-8 p-6 max-w-7xl mx-auto w-full"></div>
        </div>
    </div>

    <main aria-label="좌석 지도" tabindex="0" class="flex-1 overflow-auto p-4 md:p-10 map-canvas-bg relative grab-mode" id="viewport">
        <!-- 배경색을 원상 복구 (bg-stone-50) -->
        <div id="floorplanContainer" class="bg-stone-50 border border-stone-300 shadow-2xl p-6 md:p-10 rounded-3xl relative transition-transform duration-150 origin-top-left flex flex-col gap-4 mx-auto w-max">
            <div class="flex items-center justify-between pb-4 border-b border-stone-300">
                <div id="tabTitle" class="flex items-center gap-3 text-stone-800 font-black text-sm tracking-wide">
                    <span class="w-3.5 h-3.5 bg-[#4F81BD] rounded-full inline-block"></span>
                    데이터 로딩 중...
                </div>
                <!-- 줌인 안내문구 추가 -->
                
            </div>

            <div id="canvasWrapper" class="overflow-auto max-w-full relative">
                <div id="dynamicFloorplan"></div>
            </div>
        </div>
    </main>

    <script src="camera.js"></script>
    <script src="search.js"></script>
    <script src="app.js"></script>

</body>
</html>
